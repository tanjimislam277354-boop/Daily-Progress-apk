ateElement('span');\n    d.className = 'rp';\n    d.style.left = ((e.clientX || r.left + r.width / 2) - r.left) + 'px';\n    d.style.top = ((e.clientY || r.top + r.height / 2) - r.top) + 'px';\n    host.appendChild(d);\n    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 480);\n  }\n  function burst(x, y, n, spread) {\n    var f = document.createDocumentFragment(), nodes = [], i;\n    for (i = 0; i < n; i++) {\n      var a = Math.random() * 6.2832, d = spread * (0.45 + Math.random() * 0.65), s = document.createElement('i');\n      s.className = 'pt' + (i % 3 === 0 ? ' sq' : '');\n      s.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + COL[i % COL.length] + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + spread * 0.3) + 'px';\n      f.appendChild(s); nodes.push(s);\n    }\n    fx.appendChild(f);\n    setTimeout(function () { for (var j = 0; j < nodes.length; j++) if (nodes[j].parentNode) nodes[j].parentNode.removeChild(nodes[j]); }, 760);\n  }\n  function barCls(f) { return f > 0.5 ? '' : (f > 0.2 ? 'bl' : 'rd'); }\n\n  /* ---------- state ---------- */\n  var sel = todayKey(), openAct = null, editT = false, editP = false;\n\n\n  function goalDue(sec) {\n    var best = null, it, now = Date.now(), i;\n    try {\n      var g = JSON.parse(window.localStorage.getItem('goal_planner_v1') || '{}').items || [];\n      for (i = 0; i < g.length; i++) { it = g[i]; if (it.sec === sec && !it.done && it.due && (!best || it.due < best.due)) best = it; }\n    } catch (e) {}\n    return best;\n  }\n  function tile(sec, lab, cls) {\n    var td = todayKey(), g = goalDue(sec), left, sub, d = new Date();\n    if (g) { left = diffDays(keyOf(new Date(g.due)), td); sub = g.t; }\n    else if (sec === 'wk') { left = (5 - d.getDay() + 7) % 7; sub = 'Week ends Fri'; }\n    else { left = diffDays(keyOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)), td); sub = 'Month end'; }\n    return '<div class=\"t3 ' + cls + '\"><div class=\"k\">' + lab + '<\/div><div class=\"n' + (left < 0 ? ' late' : '') + '\">' + Math.abs(left) + '<small>' + (left < 0 ? 'late' : (left === 1 ? 'day' : 'days')) + '<\/small><\/div><div class=\"s\">' + esc(sub) + '<\/div><\/div>';\n  }\n  function rTarget2() {\n    var d = new Date();\n    $('c-target').innerHTML = '<div class=\"ct\"><span class=\"t\">MY TARGET<\/span><span class=\"v\">auto from Goal Planner<\/span><\/div><div class=\"tg3\">' + tile('mo', 'MONTHLY', 'm') + tile('wk', 'WEEKLY', '') +\n      '<div class=\"t3\"><div class=\"k\">TODAY<\/div><div class=\"ck\" id=\"tgclk\"><\/div><div class=\"s\">' + WD[d.getDay()] + ', ' + d.getDate() + ' ' + MO[d.getMonth()] + '<\/div><\/div><\/div>';\n    tickClk();\n  }\n  function tickClk() {\n    var e = $('tgclk'); if (!e) return;\n    var d = new Date(), h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;\n    e.innerHTML = h + ':' + p2(d.getMinutes()) + '<small style=\"font-size:12px;color:#60a5fa\">:' + p2(d.getSeconds()) + ' ' + ap + '<\/small>';\n  }\n  setInterval(function () { if (!document.hidden) tickClk(); }, 1000);\n  function mini(act) {\n    var A = ACT[act], i, v = [], mx = 1, c = mins(act, sel), y = mins(act, addDays(sel, -1)), ch = change(c, y), good = (act === 'study' || act === 'cls');\n    for (i = 6; i >= 0; i--) { var m = mins(act, addDays(sel, -i)); v.push(m); if (m > mx) mx = m; }\n    var cls = ch.c ? ((ch.c === 'up') === good ? 'gd' : 'bd') : '', sp = '';\n    for (i = 0; i < 7; i++) sp += '<i style=\"height:' + Math.round(v[i] / mx * 20) + 'px' + (i === 6 ? ';background:#3b82f6' : '') + '\"><\/i>';\n    return '<div class=\"mc\"><div class=\"k\">' + A.ic + ' ' + A.t.toUpperCase() + '<\/div><div class=\"n\">' + big(c) + '<\/div><span class=\"cp ' + cls + '\">' + ch.t + '<\/span><div class=\"sp\">' + sp + '<\/div><\/div>';\n  }\n  function miniTask() {\n    var s = taskStats(), p = s.n ? Math.round((s.n - s.pend) * 100 / s.n) : 0;\n    return '<div class=\"mc\"><div class=\"k\">\ud83d\udee0\ufe0f BIG TASKS<\/div><div class=\"n\">' + p + '%<\/div><span class=\"cp ' + (p >= 50 ? 'gd' : (s.n ? 'bd' : '')) + '\">' + (s.n - s.pend) + '/' + s.n + ' done<\/span><div class=\"pb\" style=\"margin-top:8px\"><i class=\"bl\" style=\"transform:scaleX(' + p / 100 + ')\"><\/i><\/div><\/div>';\n  }\n  /* ---------- 1. target headline ---------- */\n  function rTarget() { return rTarget2();\n    var t = DB.target, td = todayKey(), left = diffDays(t.date, td);\n    var total = Math.max(1, diffDays(t.date, t.start)), el = Math.max(0, diffDays(td, t.start));\n    var frac = Math.min(1, el / total), h = '';\n    if (editT) {\n      h = '<div class=\"ct\"><span class=\"t\">EDIT TARGET<\/span><\/div>' +\n        '<div class=\"lbl\" style=\"margin-top:0\">Target name<\/div><input class=\"in\" id=\"tn\" type=\"text\" maxlength=\"60\" value=\"' + esc(t.name) + '\">' +\n        '<div class=\"lbl\">Target date<\/div><input class=\"in\" id=\"td\" type=\"date\" value=\"' + t.date + '\">' +\n        '<div class=\"acts\"><button class=\"bt\" data-a=\"tsave\" type=\"button\">Save<\/button><button class=\"bt cn\" data-a=\"tcancel\" type=\"button\">Cancel<\/button><\/div>';\n    } else {\n      var bigTxt;\n      if (left > 0) bigTxt = left + '<small>' + (left === 1 ? 'day left' : 'days left') + '<\/small>';\n      else if (left === 0) bigTxt = 'Today<small>is the day<\/small>';\n      else bigTxt = Math.abs(left) + '<small>days ago<\/small>';\n      var dd = parseKey(t.date);\n      h = '<div class=\"ct\"><span class=\"t\">' + esc(t.name).toUpperCase() + '<\/span><button class=\"sm\" data-a=\"tedit\" type=\"button\">Edit<\/button><\/div>' +\n        '<div class=\"big' + (left < 0 ? ' late' : '') + '\">' + bigTxt + '<\/div>' +\n        '<div class=\"sub\">Target ' + dd.getDate() + ' ' + MO[dd.getMonth()] + ' ' + dd.getFullYear() + ' \u00b7 Day ' + Math.min(total, el + 1) + ' of ' + total + '<\/div>' +\n        '<div class=\"pb\"><i class=\"' + (left < 0 ? 'rd' : '') + '\" style=\"transform:scaleX(' + frac + ')\"><\/i><\/div>';\n    }\n    $('c-target').innerHTML = h;\n  }\n\n  /* ---------- 2. time left today ---------- */\n  function dayCalc() {\n    var p = DB.plan, wake = tmin(p.wake), sl = tmin(p.sleep), i, D = 0, now = new Date();\n    var nowM = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;\n    if (sl <= wake) { sl += 1440; if (nowM < wake && nowM < sl - 1440) nowM += 1440; }\n    var W = sl - wake;\n    for (i = 0; i < p.ded.length; i++) D += (+p.ded[i].h || 0) * 60;\n    var free = Math.max(0, W - D), el = Math.min(W, Math.max(0, nowM - wake));\n    var left = free * (1 - el / W);\n    var state = nowM < wake ? 'before' : (nowM >= sl ? 'after' : 'live');\n    return { W: W, D: D, free: free, left: left, sleepH: (1440 - W) / 60, state: state };\n  }\n  function rDay() {\n    var p = DB.plan, c = dayCalc(), h = '', i;\n    if (editP) {\n      h = '<div class=\"ct\"><span class=\"t\">EDIT DAILY TIME<\/span><\/div>' +\n        '<div class=\"row2\"><div class=\"f\"><span>Wake up<\/span><input class=\"in\" type=\"time\" data-f=\"wake\" value=\"' + esc(p.wake) + '\"><\/div>' +\n        '<div class=\"f\"><span>Sleep<\/span><input class=\"in\" type=\"time\" data-f=\"sleep\" value=\"' + esc(p.sleep) + '\"><\/div><\/div>' +\n        '<div class=\"lbl\">Other daily time to skip (meals, prayer, chores\u2026)<\/div>';\n      for (i = 0; i < p.ded.length; i++) {\n        h += '<div class=\"dr\"><div class=\"f\"><input class=\"in\" type=\"text\" maxlength=\"24\" data-f=\"dn\" data-i=\"' + i + '\" value=\"' + esc(p.ded[i].n) + '\" placeholder=\"Name\"><\/div>' +\n             '<div class=\"f2\"><input class=\"in\" type=\"number\" inputmode=\"decimal\" step=\"0.5\" min=\"0\" max=\"24\" data-f=\"dh\" data-i=\"' + i + '\" value=\"' + p.ded[i].h + '\"><\/div>' +\n             '<button class=\"x\" data-a=\"prem\" data-i=\"' + i + '\" type=\"button\" aria-label=\"Remove\">\u2715<\/button><\/div>';\n      }\n      h += '<div class=\"acts\"><button class=\"bt cn\" data-a=\"padd\" type=\"button\">+ Add item<\/button><button class=\"bt\" data-a=\"pdone\" type=\"button\">Done<\/button><\/div>';\n    } else {\n      var frac = c.free > 0 ? c.left / c.free : 0;\n      var sub = c.state === 'before' ? 'Day starts at ' + t12(p.wake) : (c.state === 'after' ? 'Day is over \u00b7 sleep time' : 'of ' + big(c.free) + ' free today');\n      h = '<div class=\"ct\"><span class=\"t\">TIME LEFT TODAY<\/span><button class=\"sm\" data-a=\"pedit\" type=\"button\">Edit<\/button><\/div>' +\n        '<div class=\"big\">' + big(c.left) + '<\/div><div class=\"sub\">' + sub + '<\/div>' +\n        '<div class=\"pb\"><i class=\"' + barCls(frac) + '\" style=\"transform:scaleX(' + frac + ')\"><\/i><\/div>' +\n        '<div class=\"tags\"><span class=\"tag\">Sleep <b>' + hrs(c.sleepH) + '<\/b><\/span>';\n      for (i = 0; i < p.ded.length; i++) h += '<span class=\"tag\">' + esc(p.ded[i].n || 'Other') + ' <b>' + hrs(+p.ded[i].h || 0) + '<\/b><\/span>';\n      h += '<span class=\"tag\">Awake <b>' + t12(p.wake) + ' \u2013 ' + t12(p.sleep) + '<\/b><\/span><\/div>';\n    }\n    $('c-day').innerHTML = h;\n  }\n\n  /* ---------- logging box (shared) ---------- */\n  function logBox(act) {\n    var e = entries(act, sel), h = '<div class=\"ents\">', i, ex = extMin(act, sel);\n    if (ex > 0) h += '<span class=\"ent ex\">From Timer ' + lst(ex) + '<\/span>';\n    for (i = 0; i < e.length; i++) h += '<span class=\"ent\">' + lst(e[i]) + '<button type=\"button\" data-a=\"logdel\" data-act=\"' + act + '\" data-i=\"' + i + '\" aria-label=\"Remove\">\u2715<\/button><\/span>';\n    if (!e.length && ex <= 0) h += '<span class=\"emp\" style=\"padding:0 0 6px\">Nothing written for ' + (sel === todayKey() ? 'today' : dayLabel(sel)) + '<\/span>';\n    h += '<\/div><div class=\"row2\" data-act=\"' + act + '\"><div class=\"f\"><span>Hours<\/span><input class=\"in lh\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"24\" x;color:var(--mt)}\n.lg u{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 0;text-decoration:none}\n.lg u+span{margin-right:12px}\n.bars{display:flex;align-items:flex-end;height:118px;padding-top:4px}\n.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}\n.bv{font-size:9.5px;color:var(--mt);margin-bottom:3px;height:12px;line-height:12px}\n.bs{display:flex;flex-direction:column;justify-content:flex-end;width:22px;border-radius:4px 4px 0 0;overflow:hidden}\n.bs i{display:block;width:100%}\n.bs .s{background:var(--gl)}\n.bs .c{background:var(--b)}\n.bl2{margin-top:5px;font-size:10px;color:var(--mt)}\n.bc.td .bl2{color:var(--bl);font-weight:700}\n.bc.td .bv{color:var(--tx)}\n.bs.e{height:2px;background:#1a1d1b;border-radius:1px}\n\n.dl{margin-top:12px}\n.dr{display:flex;align-items:center;padding:9px 2px;border-top:1px solid var(--ln)}\n.dr .a{flex:1;min-width:0}\n.dr .a b{display:block;font-size:13px;font-weight:600}\n.dr .a small{display:block;font-size:10.5px;color:var(--mt);margin-top:1px}\n.dr .t{font-size:14px;font-weight:700;margin-right:10px}\n.dr .p{flex:none;min-width:62px;text-align:center;padding:3px 0;border-radius:12px;font-size:11.5px;font-weight:700;background:#0d0f0d}\n.dr .p.up{background:var(--gd)}\n.dr .p.dn2{background:#2a0f0f}\n\n.emp{padding:6px 2px;font-size:12px;color:var(--mt)}\n\n/* ripple */\n.rp{\n  position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;\n  border-radius:50%;background:rgba(255,255,255,.22);\n  pointer-events:none;animation:rp .45s ease-out forwards;\n}\n.chip .rp{background:rgba(74,222,128,.25)}\n@keyframes rp{from{transform:scale(0);opacity:1}to{transform:scale(1.6);opacity:0}}\n\n/* toast */\n#toast{\n  position:fixed;left:50%;bottom:calc(22px + var(--sab));z-index:20;\n  max-width:88%;padding:10px 16px;border-radius:22px;\n  background:var(--gd);border:1px solid #14532d;color:#d1fae5;\n  font-size:13px;font-weight:600;text-align:center;\n  opacity:0;pointer-events:none;\n  transform:translate(-50%,12px);\n  transition:opacity .2s,transform .2s;\n}\n#toast.on{opacity:1;transform:translate(-50%,0)}\n\n@media (prefers-reduced-motion:reduce){\n  *{animation:none!important;transition:none!important}\n}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"hd\">\n  <h1>Timer<\/h1>\n  <span class=\"tc\" id=\"tchip\">Today 0m<\/span>\n<\/div>\n\n<h2 class=\"hl\">Self Study<\/h2>\n<section class=\"card\">\n  <div class=\"dial\" id=\"dial\">\n    <svg viewBox=\"0 0 120 120\" aria-hidden=\"true\">\n      <circle class=\"tick\" cx=\"60\" cy=\"60\" r=\"57\"/>\n      <circle class=\"trk\" cx=\"60\" cy=\"60\" r=\"49\"/>\n      <circle class=\"arc\" id=\"arc\" cx=\"60\" cy=\"60\" r=\"49\" pathLength=\"100\"/>\n    <\/svg>\n    <div class=\"dt\">\n      <div class=\"tm\" id=\"tm\">25:00<\/div>\n      <div class=\"tl\" id=\"tl\">Ready<\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"setup\">\n    <div class=\"chips\" id=\"chips\">\n      <button class=\"chip\" type=\"button\" data-s=\"900\">15m<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"1500\">25m<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"1800\">30m<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"2700\">45m<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"3600\">1h<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"5400\">1.5h<\/button>\n      <button class=\"chip\" type=\"button\" data-s=\"7200\">2h<\/button>\n    <\/div>\n    <div class=\"trio\">\n      <label class=\"fld\"><span>Hours<\/span><input id=\"ih\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"99\" placeholder=\"0\"><\/label>\n      <label class=\"fld\"><span>Min<\/span><input id=\"im\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"59\" placeholder=\"0\"><\/label>\n      <label class=\"fld\"><span>Sec<\/span><input id=\"is\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"59\" placeholder=\"0\"><\/label>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"btn\" id=\"b1\" type=\"button\">Start<\/button>\n    <button class=\"btn out\" id=\"b2\" type=\"button\" hidden>Reset<\/button>\n  <\/div>\n<\/section>\n\n<h2 class=\"hl\">Class Hours<\/h2>\n<section class=\"card\">\n  <div class=\"cin\">\n    <label class=\"fld\"><span>Hours<\/span><input id=\"ch\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"24\" placeholder=\"0\"><\/label>\n    <label class=\"fld\"><span>Min<\/span><input id=\"cm\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"59\" placeholder=\"0\"><\/label>\n    <button class=\"btn bl\" id=\"cadd\" type=\"button\">Add<\/button>\n  <\/div>\n  <div class=\"ents\" id=\"ents\"><\/div>\n  <div class=\"cs\" id=\"cs\"><\/div>\n<\/section>\n\n<h2 class=\"hl\">Daily Progress<\/h2>\n<section class=\"card\" id=\"prog\"><\/section>\n\n<div id=\"toast\" role=\"status\"><\/div>\n\n<script>\n(function () {\n  var KEY = 'timer_app_v1';\n  var DB = { days: {}, timer: { dur: 1500, st: 'idle', end: 0, left: 1500 } };\n  try {\n    var raw = window.localStorage.getItem(KEY);\n    if (raw) {\n      var o = JSON.parse(raw);\n      if (o && o.days) DB.days = o.days;\n      if (o && o.timer) DB.timer = o.timer;\n    }\n  } catch (e) {}\n  var T = DB.timer;\n  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }\n\n  var $ = function (id) { return document.getElementById(id); };\n  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n\n  /* ---------- helpers ---------- */\n  function p2(n) { return n < 10 ? '0' + n : '' + n; }\n  function dayOff(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n); return d; }\n  function dk(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }\n  function dayObj(k, make) {\n    var x = DB.days[k];\n    if (!x && make) { x = DB.days[k] = { s: 0, c: [] }; }\n    return x;\n  }\n  function selfSec(k) { var x = DB.days[k]; return x ? (x.s || 0) : 0; }\n  function classMin(k) {\n    var x = DB.days[k], t = 0, i;\n    if (x && x.c) for (i = 0; i < x.c.length; i++) t += x.c[i];\n    return t;\n  }\n  function total(k) { return selfSec(k) + classMin(k) * 60; }\n  function fmt(sec) {\n    sec = Math.round(sec);\n    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);\n    if (h > 0) return h + 'h ' + m + 'm';\n    if (m > 0) return m + 'm';\n    return sec > 0 ? sec + 's' : '0m';\n  }\n  function fmtClock(s) {\n    s = Math.ceil(s);\n    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;\n    return h > 0 ? h + ':' + p2(m) + ':' + p2(ss) : p2(m) + ':' + p2(ss);\n  }\n  function change(cur, base) {\n    if (base <= 0) return cur > 0 ? { t: 'New', c: 'up' } : { t: '\u2014', c: 'nz' };\n    var p = Math.round((cur - base) / base * 100);\n    if (p > 0) return { t: '\u25b2 ' + p + '%', c: 'up' };\n    if (p < 0) return { t: '\u25bc ' + Math.abs(p) + '%', c: 'dn2' };\n    return { t: '0%', c: 'nz' };\n  }\n\n  var toastT = null;\n  function toast(msg) {\n    var t = $('toast');\n    t.textContent = msg;\n    t.className = 'on';\n    clearTimeout(toastT);\n    toastT = setTimeout(function () { t.className = ''; }, 2200);\n  }\n  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }\n  function beep() {\n    try {\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return;\n      var ctx = new AC(), i;\n      for (i = 0; i < 3; i++) {\n        var os = ctx.createOscillator(), gn = ctx.createGain(), t0 = ctx.currentTime + i * 0.35;\n        os.type = 'sine';\n        os.frequency.value = 880;\n        gn.gain.setValueAtTime(0.0001, t0);\n        gn.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);\n        gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);\n        os.connect(gn);\n        gn.connect(ctx.destination);\n        os.start(t0);\n        os.stop(t0 + 0.3);\n      }\n      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1500);\n    } catch (e) {}\n  }\n\n  /* ---------- timer ---------- */\n  var dial = $('dial'), arc = $('arc'), tm = $('tm'), tl = $('tl');\n  var b1 = $('b1'), b2 = $('b2'), setup = $('setup');\n  var ih = $('ih'), im = $('im'), is = $('is');\n  var iv = null;\n\n  function readInputs() {\n    var h = parseInt(ih.value, 10) || 0, m = parseInt(im.value, 10) || 0, s = parseInt(is.value, 10) || 0;\n    var d = h * 3600 + m * 60 + s;\n    return Math.min(d, 359999);\n  }\n  function writeInputs(sec) {\n    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;\n    ih.value = h || '';\n    im.value = m || '';\n    is.value = s || '';\n  }\n  function leftSec() {\n    if (T.st === 'run') return Math.max(0, (T.end - Date.now()) / 1000);\n    if (T.st === 'pause') return T.left;\n    if (T.st === 'over') return 0;\n    return readInputs();\n  }\n  function markChips() {\n    var d = readInputs(), cs = $('chips').querySelectorAll('.chip');\n    for (var i = 0; i < cs.length; i++) {\n      cs[i].className = 'chip' + (T.st === 'idle' && +cs[i].getAttribute('data-s') === d ? ' on' : '');\n    }\n  }\n\n  function render() {\n    var l = leftSec(), dur = T.st === 'idle' ? l : T.dur, f = dur > 0 ? l / dur : 0;\n    if (f > 1) f = 1;\n    var cls = 'dial';\n    if (f > 0.5) cls += ' ph-g'; else if (f > 0.2) cls += ' ph-b'; else cls += ' ph-r';\n    if (T.st === 'run') cls += ' run live';\n    if (T.st === 'pause') cls += ' live';\n    if (T.st === 'run' && l <= 10) cls += ' urgent';\n    if (T.st === 'over') cls += ' over ph-r';\n    var txt = fmtClock(l);\n    if (txt.length > 5) cls += ' long';\n    dial.className = cls;\n    tm.textContent = txt;\n    arc.style.strokeDashoffset = 100 - f * 100;\n    arc.style.opacity = f <= 0 ? 0 : 1;\n\n    var lab = 'Ready';\n    if (T.st === 'run') {\n      lab = l <= 10 ? 'Almost done' : 'Ends ' + new Date(T.end).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });\n    } else if (T.st === 'pause') lab = 'Paused';\n    else if (T.st === 'over') lab = \"Time's up\";\n    else if (l <= 0) lab = 'Set a time';\n    tl.textContent = lab;\n\n    setup.hidden = T.st !== 'idle';\n    b2.hidden = T.st === 'idle' || T.st === 'over';\n    if (T.st === 'idle') { b1.textContent = 'Start'; b1.className = 'btn'; }\n    else if (T.st === 'run') { b1.textContent = 'Pause'; b1.className = 'btn bl'; }\n    else if (T.st === 'pause') { b1.textContent = 'Resume'; b1.className = 'btn'; }\n    else { b1.textContent = 'Done'; b1.className = 'btn dn'; }\n\n    document.title = T.st === 'run' ? fmtClock(l) + ' \u00b7 Timer' : 'Timer';\n    if (T.st === 'idle') markChips();\n  }\n\n  function logSelf(sec) {\n    if (sec <= 0) return;\n    var x = dayObj(dk(new Date()), true);\n    x.s = (x.s || 0) + Math.round(sec);\n    save();\n    renderProg();\n  }\n\n  function startIv() { if (!iv) iv = setInterval(tick, 250); }\n  function stopIv() { if (iv) { clearInterval(iv); iv = null; } }\n\n  function finish(silent) {\n    stopIv();\n    T.st = 'over';\n    T.left = 0;\n    logSelf(T.dur);\n    save();\n    render();\n    toast(fmt(T.dur) + ' logged \u00b7 Session complete');\n    if (!silent) { vib([300, 150, 300, 150, 600]); beep(); }\n  }\n  function tick() {\n    if (T.st !== 'run') { stopIv(); return; }\n    if (T.end - Date.now() <= 0) { finish(false); return; }\n    render();\n  }\n\n  b1.addEventListener('click', function () {\n    if (T.st === 'idle') {\n      var d = readInputs();\n      if (d <= 0) { toast('Set a time first'); return; }\n      T.dur = d; T.left = d; T.end = Date.now() + d * 1000; T.st = 'run';\n      save(); render(); startIv();\n    } else if (T.st === 'run') {\n      T.left = leftSec(); T.st = 'pause'; stopIv(); save(); render();\n    } else if (T.st === 'pause') {\n      T.end = Date.now() + T.left * --ln);border-radius:14px}\n.pt{display:flex;align-items:center;padding:12px 14px 10px}\n.pn{flex:1;min-width:0}\n.pn b{display:block;font-size:15px;font-weight:700;line-height:1.25}\n.pn small{display:block;font-size:11.5px;color:var(--mt);margin-top:1px}\n.cn{flex:none;font-size:12px;font-weight:800;padding:3px 9px;border-radius:11px;color:#fff;background:#2a0f0f;transition:background-color .4s}\n.pbr{height:3px;background:#101210}\n.pbr i{display:block;height:100%;background:var(--r);transform-origin:0 50%;transform:scaleX(0);transition:transform .4s ease-out,background-color .4s}\n\n.it{border-bottom:1px solid var(--ln)}\n.it:last-child{border-bottom:0}\n.tr{position:relative;overflow:hidden;display:flex;align-items:center;min-height:48px;padding:0 12px 0 14px;cursor:pointer;touch-action:manipulation}\n.it:last-child .tr{border-radius:0 0 13px 13px}\n.cb{flex:none;display:block;width:22px;height:22px;margin-right:12px}\n.cb u{position:relative;display:block;width:22px;height:22px;border:1.6px solid #3b423e;border-radius:6px;text-decoration:none;transition:background-color .14s,border-color .14s}\n.cb u:after{content:\"\";position:absolute;left:6px;top:1.5px;width:6px;height:11px;border:solid #00210d;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);opacity:0;transition:transform .15s ease-out,opacity .1s}\n.done .cb u{background:var(--gl);border-color:var(--gl)}\n.done .cb u:after{transform:rotate(45deg) scale(1);opacity:1}\n.cb.pp u{animation:pop .24s ease-out}\n@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}\n.tn{flex:1;min-width:0;padding:8px 0}\n.lb{font-size:14.5px;line-height:1.4;word-wrap:break-word;overflow-wrap:break-word;background:linear-gradient(var(--mt),var(--mt)) no-repeat 0 57%/0% 2px;transition:background-size .38s ease-out,color .3s}\n.done .lb{background-size:100% 2px;color:var(--mt)}\n.nt{display:block;font-size:11px;color:var(--mt);margin-top:1px}\n.fc{flex:none;margin-left:8px;padding:2px 8px; ter;margin-top:10px;font-size:13px;color:var(--mt)}\n.nin span{margin-right:8px}\n.nin span.sl{margin-right:10px}\n.nin input{width:58px;height:36px;margin-right:6px;padding:0 8px;text-align:center;background:#0d0f0d;border:1px solid #1f2421;border-radius:10px;color:var(--tx);font-family:inherit;font-size:16px}\n.nin input:focus{outline:none;border-color:#2563eb}\n.nr{display:flex;align-items:baseline;margin-top:12px}\n.nr b{font-size:20px;font-weight:800}\n.nr span{margin-left:8px;font-size:12px;color:var(--mt)}\n.nbar{height:5px;margin-top:8px;background:#101210;border-radius:3px;overflow:hidden}\n.nbar i{display:block;height:100%;border-radius:3px;transform-origin:0 50%;transform:scaleX(0);transition:transform .35s ease-out,background-color .35s}\n\n/* day review */\n.nh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}\n.nh span{font-size:11.5px;font-weight:600;color:var(--mt)}\n.nl{display:block;margin:14px 0 6px;font-size:12.5px;font-weight:700;color:var(--bl)}\n.nc textarea{display:block;width:100%;min-height:96px;padding:10px 12px;resize:vertical;background:#0d0f0d;border:1px solid #1f2421;border-radius:10px;color:var(--tx);font-family:inherit;font-size:16px;line-height:1.5}\n.nc textarea:focus{outline:none;border-color:#2563eb}\n.nc textarea::placeholder{color:#4a524e}\n.np{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln);font-size:13px;color:var(--mt)}\n.np b{font-size:20px;font-weight:800}\n\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"hd\"><h1>Daily Routine<\/h1><span class=\"hp\" id=\"hp\">0%<\/span><\/div>\n\n<div class=\"card\">\n  <div class=\"ttl\">Allah manuske onek gula sujog dey, but manus sujog gula haray fele<\/div>\n  <div class=\"mo\" id=\"mo\"><\/div>\n<\/div>\n\n<div class=\"card\">\n  <div class=\"sum\">\n    <div class=\"rgw\">\n      <svg class=\"rg\" viewBox=\"0 0 36 36\"><circle class=\"rt\" cx=\"18\" cy=\"18\" r=\"15.5\"/><circle class=\"rf\" id=\"rf\" cx=\"18\" cy=\"18\" r=\"15.5\" pathLength=\"100\"/><\/svg>\n      <span class=\"rv\" id=\"rv\">0%<\/span>\n    <\/div>\n    <div class=\"si\">\n      <div class=\"s1\"><b id=\"sd\">0<\/b><span id=\"st\">/ 25 done<\/span><\/div>\n      <div class=\"s2\"><b id=\"sl\">25<\/b> left<\/div>\n      <div class=\"s3\" id=\"sm\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"bar\"><i id=\"sb\"><\/i><\/div>\n  <div class=\"wk\" id=\"wk\"><\/div>\n<\/div>\n<div class=\"view\" id=\"view\" hidden><\/div>\n\n<div id=\"list\"><\/div>\n\n<div class=\"card nc\" id=\"nc\">\n  <div class=\"nh\">Day review <span id=\"nd\"><\/span><\/div>\n  <label class=\"nl\" for=\"n1\">Problems<\/label>\n  <textarea id=\"n1\" placeholder=\"Ekhane likho\u2026\"><\/textarea>\n  <label class=\"nl\" for=\"n2\">Where I can improve<\/label>\n  <textarea id=\"n2\" placeholder=\"Ekhane likho\u2026\"><\/textarea>\n  <div class=\"np\"><span>Today's routine complete<\/span><b id=\"np\">0%<\/b><\/div>\n  <div class=\"bar\"><i id=\"nb\"><\/i><\/div>\n<\/div>\n<div id=\"fx\"><\/div>\n\n<script>\n(function () {\n  var KEY = 'daily_routine_v1';\n  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n  var MONTHS = ['Jan', 'Mar', 'Sept', 'Oct'];\n  var STATE = ['\u274c', '\u2705', '\u2753'];\n  var COL = ['#22c55e', '#4ade80', '#3b82f6', '#86efac', '#ffffff', '#60a5fa'];\n\n  var PH = [\n    { h: 'Phase 1', s: 'Fozor', nap: true, items: [\n      { t: 'Fozor', f: 1 }, { t: 'Golden hour utilize' }, { t: 'Breathing + visualize', n: 'write' }, { t: 'At least 3h study', tm: 180 }] },\n    { h: 'Phase 2', s: 'Juhr', items: [\n      { t: 'Juhr', f: 1 }, { t: 'Before 2pm lunch' }, { t: 'At least 2h study', tm: 120 }] },\n    { h: 'Phase 3', s: 'Asor', items: [\n      { t: 'Asor', f: 1 }, { t: 'Room clean' }, { t: 'Workout' }, { t: 'Egg' }, { t: 'Me time' },\n      { t: 'WhatsApp message check' }, { t: 'Entertainment' }, { t: 'Guideline' },\n      { t: 'Next day resource download' }, { t: 'Internet off', n: 'block, if necessary' }] },\n    { h: 'Phase 4', s: 'Magrib \u00b7 decides next day', items: [\n      { t: 'Magrib', f: 1 }, { t: '1h 15m study', tm: 75 }] },\n    { h: 'Phase 5', s: 'Isha', items: [\n      { t: 'Isha', f: 1 }, { t: 'Ensure 20\u201330 min dinner max' }, { t: '3h study', tm: 180, n: '1h of this = revision + exam (below)' },\n      { t: 'Previous chap revision + active recall', tm: 30, s: 1 },\n      { t: 'Exam', tm: 30, s: 1 },\n      { t: 'Full day tracking', n: '30 min before sleep' }] }\n  ];\n  var TOTAL = 0, i, j, ITM = {};\n  for (i = 0; i < PH.length; i++) {\n    for (j = 0; j < PH[i].items.length; j++) { PH[i].items[j].id = 'p' + (i + 1) + '_' + j; ITM[PH[i].items[j].id] = PH[i].items[j]; TOTAL++; }\n  }\n\n  function p2(n) { return n < 10 ? '0' + n : '' + n; }\n  function keyOf(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }\n  function parseKey(k) { var a = k.split('-'); return new Date(+a[0], +a[1] - 1, +a[2], 12, 0, 0); }\n  function addDays(k, n) { var d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }\n  function todayKey() { return keyOf(new Date()); }\n  function dayLabel(k) { var d = parseKey(k); return WD[d.getDay()] + ', ' + MO[d.getMonth()] + ' ' + d.getDate(); }\n  function hue(p) { return Math.round(p * 1.2); }\n  function fill(p) { return 'hsl(' + hue(p) + ',72%,44%)'; }\n  function soft(p) { return 'hsl(' + hue(p) + ',60%,16%)'; }\n  function lite(p) { return 'hsl(' + hue(p) + ',80%,62%)'; }\n\n  var DB = { days: {}, mo: [0, 0, 0, 2], notes: {}, tm: {}, tmDay: '', nap: {} };\n  try {\n    var raw = window.localStorage.getItem(KEY);\n    if (raw) { var o = JSON.parse(raw); if (o.days) DB.days = o.days; if (o.mo && o.mo.length === 4) DB.mo = o.mo; if (o.notes) DB.notes = o.notes; if (o.tm) DB.tm = o.tm; if (o.tmDay) DB.tmDay = o.tmDay; if (o.nap) DB.nap = o.nap; }\n  } catch (e) {}\n  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }\n\n  var $ = function (id) { return document.getElementById(id); };\n  var fx = $('fx'), sel = todayKey();\n\n  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }\n  function ripple(host, e) {\n    var r = host.getBoundingClientRect(), d = document.createElement('span');\n    d.className = 'rp';\n    d.style.left = ((e.clientX || r.left + r.width / 2) - r.left) + 'px';\n    d.style.top = ((e.clientY || r.top + r.height / 2) - r.top) + 'px';\n    host.appendChild(d);\n    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 480);\n  }\n  function burst(x, y, n, spread) {\n    var f = document.createDocumentFragment(), nodes = [], k;\n    for (k = 0; k < n; k++) {\n      var a = Math.random() * 6.2832, d = spread * (0.45 + Math.random() * 0.65), s = document.createElement('i');\n      s.className = 'pr' + (k % 3 === 0 ? ' sq' : '');\n      s.style.cssText = 'left:' + x + 'px;top:' + y + 'px;background:' + COL[k % COL.length] + ';--dx:' + Math.round(Math.cos(a) * d) + 'px;--dy:' + Math.round(Math.sin(a) * d + spread * 0.3) + 'px';\n      f.appendChild(s); nodes.push(s);\n    }\n    fx.appendChild(f);\n    setTimeout(function () { for (var q = 0; q < nodes.length; q++) if (nodes[q].parentNode) nodes[q].parentNode.removeChild(nodes[q]); }, 760);\n  }\n\n  function doneCount(k) {\n    var d = DB.days[k], c = 0, a, b;\n    if (!d) return 0;\n    for (a = 0; a < PH.length; a++) for (b = 0; b < PH[a].items.length; b++) if (d[PH[a].items[b].id]) c++;\n    return c;\n  }\n  function pctOf(k) { return Math.round(doneCount(k) * 100 / TOTAL); }\n\n  /* ---------- timers ---------- */\n  var tmInt = null, actx = null;\n  function tmDayReset() { var tk = todayKey(); if (DB.tmDay !== tk) { DB.tm = {}; DB.tmDay =
