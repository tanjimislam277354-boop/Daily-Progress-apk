<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#070a18">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Syllabus Tracker</title>
<style>
:root{
  --bg:#070a18;
  --sf:#0e1330;
  --ln:#1b2352;
  --g:#0d9488;
  --gl:#2dd4bf;
  --gd:#0b3a3c;
  --gdd:#0a2a2c;
  --b:#8576ff;
  --bl:#b0a6ff;
  --r:#f43f5e;
  --tx:#eef0ff;
  --mt:#9aa4d4;
  --sat:0px;
  --sab:0px;
  color-scheme:dark;
}
@supports (padding-top:env(safe-area-inset-top)){
  :root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#070a18}
body{
  color:var(--tx);
  font-family:"Noto Sans Bengali","Hind Siliguri",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
  padding-bottom:calc(76px + var(--sab));
}
button{font-family:inherit}

/* top bar */
.hd{
  position:-webkit-sticky;position:sticky;top:0;z-index:6;
  height:calc(46px + var(--sat));
  padding:var(--sat) 14px 0;
  display:flex;align-items:center;justify-content:space-between;
  background:#070a18;border-bottom:1px solid var(--ln);
}
.hd h1{margin:0;font-size:18px;font-weight:700;color:var(--tx)}
.hd .sv{font-size:12.5px;color:var(--mt)}
.hd .sv.dirty{color:var(--bl)}

/* hero */
.hero{
  display:flex;align-items:center;
  margin:12px 8px 4px;padding:14px;
  background:var(--sf);border:1px solid var(--ln);border-radius:12px;
}
.hi{flex:1;min-width:0;margin-left:14px}
.h1{font-size:13.5px;color:var(--mt)}
.h2{font-size:20.5px;font-weight:700;margin-top:1px}
.h2 span{font-size:13.5px;font-weight:500;color:var(--mt)}
.h3{font-size:13px;color:#99f6e4;margin-top:3px}
.h4{font-size:11.5px;color:var(--mt);margin-top:6px}

/* rings */
.rgw{position:relative;flex:none;width:34px;height:34px}
.rgw.big{width:64px;height:64px}
.rg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:#252e63;stroke-width:3.6}
.rf{fill:none;stroke:var(--gl);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .45s ease-out}
.big .rf{stroke:var(--b)}
.rv{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--tx)}
.big .rv{font-size:17px}
.rgw.full .rv{color:var(--gl);font-size:15px}

/* groups + cards */
.gl{padding:14px 16px 6px;font-size:13px;font-weight:700;color:var(--mt);letter-spacing:.3px}
.cd{margin:0 8px 8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px}
.cd.open{border-color:#0f766e}
.ch{
  position:relative;overflow:hidden;
  display:flex;align-items:center;width:100%;
  padding:10px 12px;margin:0;border:0;border-radius:11px;
  background:transparent;color:var(--tx);text-align:left;
  touch-action:manipulation;
}
.cd.open .ch{border-radius:11px 11px 0 0;background:#0b1029}
.ch:focus{outline:none}
.ch:focus-visible{outline:2px solid var(--b);outline-offset:-2px}
.ic{flex:none;width:32px;height:32px;margin-right:11px;border-radius:9px;background:#151c46;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:18px}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.tt small{display:block;font-size:12.5px;color:var(--mt);margin-top:1px}
.chev{flex:none;width:8px;height:8px;margin:0 3px 3px 12px;border:solid #9aa4d4;border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.cd.open .chev{transform:rotate(-135deg);margin-bottom:-3px;border-color:var(--gl)}
.cd.done .ic{background:var(--gd);border-color:#0f766e}

.bd{display:none}
.cd.open .bd{display:block;animation:fi .2s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.sh{
  position:-webkit-sticky;position:sticky;top:calc(46px + var(--sat));z-index:4;
  height:28px;display:flex;align-items:center;
  background:var(--gd);border-top:1px solid #0f5d58;border-bottom:1px solid #0f5d58;
}
.st{flex:1;min-width:0;padding-left:12px;font-size:12.5px;font-weight:700;color:#ccfbf1}
.cl{flex:none;width:var(--cw);text-align:center;font-size:11.5px;font-weight:600;color:#99f6e4}
  .cl.w2{font-size:9.5px;line-height:1.05}

.r{
  position:relative;overflow:hidden;
  display:flex;align-items:center;
  min-height:40px;
  background:var(--bg);border-bottom:1px solid var(--ln);
  transition:background-color .25s;
}
.r:last-child{border-bottom:0;border-radius:0 0 11px 11px}
.r.done{background:var(--gdd)}
.n{
  flex:none;width:32px;height:24px;margin:0 3px 0 8px;
  border-radius:5px;background:#151c46;color:#b4bce2;
  font-size:11.5px;font-weight:700;line-height:24px;text-align:center;
  touch-action:manipulation;transition:background-color .2s,color .2s;
}
.done .n{background:var(--g);color:#042f2e}
.nm{flex:1;min-width:0;padding:7px 4px;font-size:14px;line-height:1.3;color:var(--tx)}
.done .nm{color:#99f6e4}
.c{
  display:block;flex:none;width:var(--cw);height:40px;padding:11px 0;
  font-style:normal;touch-action:manipulation;cursor:pointer;
}
.c u{
  position:relative;display:block;width:18px;height:18px;margin:0 auto;
  border:1.5px solid #5662a6;border-radius:4px;text-decoration:none;
  transition:background-color .12s,border-color .12s;
}
.c u:after{
  content:"";position:absolute;left:4.5px;top:.5px;width:5px;height:9px;
  border:solid #042f2e;border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(0);opacity:0;
  transition:transform .14s ease-out,opacity .1s;
}
.c.on u{background:var(--gl);border-color:var(--gl)}
.c.on u:after{transform:rotate(45deg) scale(1);opacity:1}
.c.pp u{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ripple */
.rp{
  position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;
  border-radius:50%;background:rgba(45,212,191,.26);
  pointer-events:none;animation:rp .45s ease-out forwards;
}
.ch .rp{width:260px;height:260px;margin:-130px 0 0 -130px;background:rgba(124,108,255,.18)}
.svb .rp{background:rgba(255,255,255,.28);width:200px;height:200px;margin:-100px 0 0 -100px}
@keyframes rp{from{transform:scale(0);opacity:1}to{transform:scale(1.6);opacity:0}}

/* burst particles */
#fx{position:fixed;left:0;top:0;width:100%;height:0;z-index:50;pointer-events:none}
.pt{
  position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;
  animation:pt .7s cubic-bezier(.12,.75,.3,1) forwards;
}
.pt.sq{border-radius:1px;width:6px;height:9px}
@keyframes pt{
  0%{transform:translate(0,0) scale(1);opacity:1}
  70%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}
}

/* save bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:7;
  padding:10px 12px calc(10px + var(--sab));
  background:#070a18;border-top:1px solid var(--ln);
}
.svb{
  position:relative;overflow:hidden;
  display:block;width:100%;height:46px;margin:0;border:0;border-radius:10px;
  background:var(--g);color:#fff;
  font-size:17px;font-weight:700;letter-spacing:.2px;
  touch-action:manipulation;
  transition:background-color .2s,color .2s;
}
.svb.clean{background:var(--gd);color:#99f6e4}
.svb:focus{outline:none}
.svb:focus-visible{outline:2px solid var(--b);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:420px), (prefers-reduced-motion: reduce){
  .rp,.pt{display:none!important}
  .cd.open .bd{animation:none!important}
  .rf,.chev,.c u{transition:none!important}
}
</style>
<style>
/* THEME: Indigo (main) + Aqua (second) */
:root{--main:#8576ff;--main2:#2dd4bf;--c1:#bdb4ff;--c2:#5eead4;--c3:#f0cd75;--c4:#f9a8d4;--c5:#7dd3fc}
html,body{background:transparent!important}
iframe{background:transparent!important}
body{line-height:1.4;-webkit-text-size-adjust:100%}
.hd{background:#070a18!important;border-bottom:1px solid #232c62!important}
/* colourful headlines */
.hd h1,.hl,.hl2,.card>.h1,.ttl,.hbh>span{background:linear-gradient(90deg,#c4baff,#5eead4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hl,.hl2,.hbh>span{width:-webkit-fit-content;width:fit-content}
.hd h1{font-size:21px}
.gl{color:var(--c3)!important;letter-spacing:.6px}
.ct .t{color:var(--c3)}.lbl{color:var(--c1)}
.card,.sc,.cd,.ph,.hero{background:linear-gradient(160deg,#1b2455 0%,#141b3f 100%);border-color:#1f2858}
/* section / phase / paper titles */
section.sc:nth-of-type(1) .tt b,section.ph:nth-of-type(1) .pn b,#list>.cd:nth-child(5n+1) .tt b{color:var(--c1)}
section.sc:nth-of-type(2) .tt b,section.ph:nth-of-type(2) .pn b,#list>.cd:nth-child(5n+2) .tt b{color:var(--c2)}
section.sc:nth-of-type(3) .tt b,section.ph:nth-of-type(3) .pn b,#list>.cd:nth-child(5n+3) .tt b{color:var(--c3)}
section.sc:nth-of-type(4) .tt b,section.ph:nth-of-type(4) .pn b,#list>.cd:nth-child(5n+4) .tt b{color:var(--c4)}
section.sc:nth-of-type(5) .tt b,section.ph:nth-of-type(5) .pn b,#list>.cd:nth-child(5n+5) .tt b{color:var(--c5)}
.ar[data-act="study"] .an b{color:var(--c2)}.ar[data-act="cls"] .an b{color:var(--c1)}
.ar[data-act="pc"] .an b{color:var(--c4)}.ar[data-act="ent"] .an b{color:var(--c3)}.ar[data-act="task"] .an b{color:var(--c5)}
/* colourful task names */
.it:nth-child(5n+1):not(.done):not(.fail) .lb,.tk:nth-child(5n+1):not(.done):not(.fail) .lb,.r:nth-child(5n+1):not(.done) .nm,#rows .r:nth-child(5n+1) .c1>span{color:var(--c1)}
.it:nth-child(5n+2):not(.done):not(.fail) .lb,.tk:nth-child(5n+2):not(.done):not(.fail) .lb,.r:nth-child(5n+2):not(.done) .nm,#rows .r:nth-child(5n+2) .c1>span{color:var(--c2)}
.it:nth-child(5n+3):not(.done):not(.fail) .lb,.tk:nth-child(5n+3):not(.done):not(.fail) .lb,.r:nth-child(5n+3):not(.done) .nm,#rows .r:nth-child(5n+3) .c1>span{color:var(--c3)}
.it:nth-child(5n+4):not(.done):not(.fail) .lb,.tk:nth-child(5n+4):not(.done):not(.fail) .lb,.r:nth-child(5n+4):not(.done) .nm,#rows .r:nth-child(5n+4) .c1>span{color:var(--c4)}
.it:nth-child(5n+5):not(.done):not(.fail) .lb,.tk:nth-child(5n+5):not(.done):not(.fail) .lb,.r:nth-child(5n+5):not(.done) .nm,#rows .r:nth-child(5n+5) .c1>span{color:var(--c5)}
/* tick = aqua, cross = rose */
.xf{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0 0 0 6px;padding:0;border-radius:18px;background:transparent;border:1.5px solid #3d4890;color:#8590c6;font-size:15px;line-height:1;touch-action:manipulation}
.xf:active{transform:scale(.92)}
.xf.on,.fail .xf{background:#3d1426;border-color:#fb7185;color:#fb7185}
.fail .lb{background-image:linear-gradient(#fb7185,#fb7185)!important;background-size:100% 2px!important;color:#fda4af!important;opacity:.85}
.fail .cb u{border-color:#fb7185;background:#3d1426}
.fail .cb u:before{content:"\2715";position:absolute;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);font-size:12px;line-height:1;color:#fb7185;font-style:normal}
.fail .mt,.fail .nt{opacity:.55}.fail .tb{display:none}
.tk .x{font-size:15px}
/* fit the bigger text */
.t3 .n{font-size:28px;white-space:nowrap}.t3 .n[style]{font-size:21px!important}.t3 .k{letter-spacing:.2px}
.nm{font-size:15.5px!important}
.cl{font-size:10px!important;letter-spacing:-.2px}
.n{width:35px!important;font-size:11px!important}
.cd .rgw .rv{font-size:10.5px!important}.hero .rgw.big .rv{font-size:17px!important}
</style>
<style>
/* header labels: never overlap neighbours, slimmer chapter badge to free space for columns */
.n{width:30px!important;margin:0 2px 0 6px!important}
.cl{overflow:hidden;white-space:nowrap;letter-spacing:0!important;font-size:min(10px,calc(var(--cw)*.25))!important}
.cd{margin-left:5px;margin-right:5px}
.eb2{flex:none;width:30px;height:30px;margin-right:8px;border-radius:15px;background:#151c46;border:1px solid #232c62;display:flex;align-items:center;justify-content:center;font-size:14px}
.eb2:active{transform:scale(.92)}
.edm{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(4,7,18,.82)}
.edm.on{display:flex}
.edc{width:100%;max-width:460px;max-height:88%;overflow:auto;padding:14px;border-radius:18px 18px 0 0;background:#0e1330;border:1px solid #1b2352}
.edh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.edh b{font-size:16px;color:#c4baff;min-width:0;word-break:break-word}
.edh button,.eda button,.edf button{flex:none;height:34px;padding:0 14px;border:0;border-radius:10px;background:#0d9488;color:#fff;font-weight:700;font-size:14px}
.edr{display:flex;align-items:center;margin-bottom:6px}
.edr button{flex:none;width:34px;height:36px;margin-right:5px;border:0;border-radius:9px;background:#151c46;color:#eef0ff;font-size:14px}
.edr button[disabled]{opacity:.3}
.edr .edd{margin:0 0 0 5px;background:#3d1426;color:#fb7185}
.edi,#edn{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid #232c62;border-radius:9px;background:#080c1f;color:#eef0ff;font:inherit;font-size:15px}
.edi:focus,#edn:focus{outline:none;border-color:#8576ff}
.eda{display:flex;margin-top:10px}.eda button{margin-left:8px}
.edf{margin-top:12px}.edf button{background:#151c46;border:1px solid #232c62;color:#fb7185;font-weight:600;font-size:12.5px}
.edn{font-size:12px;color:#9aa4d4;margin:0 0 8px}
</style>

.card,.sc,.cd,.ph,.hero,.cc,.hc,.hero-card,.phase-group,.analytics-card{background:#0e1330!important;border:1px solid #1b2352!important;border-radius:16px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)!important}

.hero-card,.header-icon,.btn-main,.bt,.sb{box-shadow:none!important}

<style id="modern">
/* ===== Modern phone/tablet patch: Redmi 14C, Honor Pad X7 ===== */
:root{--sal:0px;--sar:0px}
@supports (padding:env(safe-area-inset-left)){
  :root{--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
}
body{
  min-height:100vh;min-height:100dvh;
  padding-left:var(--sal);padding-right:var(--sar);
  overscroll-behavior-y:contain;
}

/* wide screen (tablet/landscape): content stays centred */
.hd{
  padding-left:max(14px,calc((100% - 760px)/2 + 14px))!important;
  padding-right:max(14px,calc((100% - 760px)/2 + 14px))!important;
}
.hero,#list{max-width:760px;margin-left:auto;margin-right:auto}
.hero{width:calc(100% - 16px)}
.bar{display:flex;justify-content:center}
.bar .svb{max-width:760px}

/* thumb-friendly touch targets */
.ch{min-height:56px}
.r{min-height:44px}
.c{height:44px;padding:13px 0;-webkit-user-select:none;user-select:none}
.n{height:28px;line-height:28px!important}
.nm{line-height:1.5}

/* edit popup */
.edc{max-height:88vh;max-height:88dvh;padding-bottom:calc(14px + var(--sab))}
.edi,#edn{font-size:16px;height:42px}
.edr button{height:42px;width:40px}

/* tablet (Honor Pad X7) */
@media (min-width:600px){
  body{font-size:17px}
  .hd h1{font-size:24px!important}
  .hero{padding:18px}
  .rgw.big{width:84px;height:84px}
  .h2{font-size:24px}
  .tt b{font-size:18px}
  .tt small{font-size:14px}
  .ic{width:40px;height:40px;font-size:22px}
  .rgw{width:42px;height:42px}
  .cd .rgw .rv{font-size:12.5px!important}
  .hero .rgw.big .rv{font-size:20px!important}
  .nm{font-size:17px!important}
  .n{width:42px!important;font-size:13px!important}
  .sh{height:34px}
  .st{font-size:14px}
  .cl{width:calc(var(--cw)*1.45);font-size:12px!important}
  .cl.w2{font-size:11px!important}
  .c{width:calc(var(--cw)*1.45);height:48px;padding:15px 0}
  .c u{width:20px;height:20px}
  .c u:after{left:5.5px;top:1px;height:10px}
  .edm{align-items:center}
  .edc{border-radius:18px;max-width:520px}
}
</style>

<div class="hd">
  <h1>Syllabus Tracker</h1>
  <span class="sv" id="svt">Saved</span>
</div>

<div class="hero">
  <div class="rgw big" id="hring"></div>
  <div class="hi">
    <div class="h1">Overall progress</div>
    <div class="h2"><b id="hd">0</b> <span>/ <i id="ht" style="font-style:normal">0</i> ticked</span></div>

</div>

<div id="list"></div>

<div class="bar">

      for (var j = 0; j < nodes.length; j++) if (nodes[j].parentNode) nodes[j].parentNode.removeChild(nodes[j]);

      p.done = d;
      all += d;
      var v = pct(d, p.total), isFull = p.total > 0 && d === p.total;
      if (isFull) full++;
      rfs[i].style.strokeDashoffset = (100 - v);
      rvs[i].textContent = isFull ? '✓' : v + '%';
      rws[i].className = 'rgw' + (isFull ? ' full' : '');
      cards[i].className = 'cd' + (i === openIdx ? ' open' : '') + (isFull ? ' done' : '');
    }
    var ap = pct(all, allTotal);
    $('hd').textContent = all;
    $('hp').textContent = full;
    var hr = $('hring');
    hr.querySelector('.rf').style.strokeDashoffset = (100 - ap);
    hr.querySelector('.rv').textContent = ap + '%';
  }

  function dirtyState() {
    var dirty = ser(st) !== savedStr;
    svb.className = 'svb' + (dirty ? '' : ' clean');
    svb.firstChild.nodeValue = dirty ? 'Save' : 'Saved ✓';
    svt.className = 'sv' + (dirty ? ' dirty' : '');
    svt.textContent = dirty ? 'Unsaved changes' : 'Saved';
  }

  function commit() {
    try { window.localStorage.setItem(KEY, JSON.stringify({ st: st, v: 6, cols: cfg })); } catch (e) {}
    savedStr = ser(st);
    dirtyState();
  }

  /* ---------- accordion ---------- */
  function toggleCard(i) {
    var prev = openIdx;
    if (prev === i) {
      openIdx = -1;
      cards[i].querySelector('.bd').innerHTML = '';
      cards[i].querySelector('.ch').setAttribute('aria-expanded', 'false');
      refresh();
      return;
    }
    if (prev >= 0) {
      cards[prev].querySelector('.bd').innerHTML = '';
      cards[prev].querySelector('.ch').setAttribute('aria-expanded', 'false');
    }
    openIdx = i;
    cards[i].querySelector('.bd').innerHTML = bodyHtml(i);
    cards[i].querySelector('.ch').setAttribute('aria-expanded', 'true');
    refresh();
    var hh = document.querySelector('.hd').offsetHeight;
    var y = cards[i].getBoundingClientRect().top + (window.pageYOffset || 0) - hh - 8;
    window.scrollTo(0, y < 0 ? 0 : y);
  }

  listEl.addEventListener('click', function (e) {
    var eb = e.target.closest('.eb2');
    var ch = e.target.closest('.ch');
    var card = e.target.closest('.cd');
    if (!card) return;
    var pi = +card.getAttribute('data-p');
    if (eb) { openEd(pi); return; }
    if (ch) { ripple(ch, e); toggleCard(pi); return; }

    var row = e.target.closest('.r');
    if (!row) return;
    var c = e.target.closest('.c'), n = e.target.closest('.n');
    if (!c && !n) return;
    var p = P[pi], ri = +row.getAttribute('data-ri'), kk = key(pi, ri);
    var before = st[kk] || 0, m = before, k, wasPaperFull = p.done === p.total;

    if (c) {
      var bit = p.bits[+c.getAttribute('data-k')];
      m ^= (1 << bit);
      var on = (m >> bit) & 1;
      c.className = 'c' + (on ? ' on pp' : '');
      c.setAttribute('aria-checked', on ? 'true' : 'false');
      setTimeout(function () { c.className = 'c' + (((m >> bit) & 1) ? ' on' : ''); }, 240);
      if (on) { burst(e.clientX, e.clientY, 5, 24); vib(8); }
    } else {
      m = (before === p.full) ? 0 : p.full;
      var cells = row.querySelectorAll('.c');
      for (k = 0; k < cells.length; k++) {
        var o = (m >> p.bits[k]) & 1;
        cells[k].className = 'c' + (o ? ' on' : '');
        cells[k].setAttribute('aria-checked', o ? 'true' : 'false');
      }
      if (m) { burst(e.clientX, e.clientY, 8, 42); vib(14); }
    }
    if (m) st[kk] = m; else delete st[kk];
    var rowFull = p.n > 0 && m === p.full;
    row.className = 'r' + (rowFull ? ' done' : '');
    ripple(row, e);
    if (c && rowFull && before !== p.full) {
      var br = row.querySelector('.n').getBoundingClientRect();
      burst(br.left + br.width / 2, br.top + br.height / 2, 8, 42);
      vib([10, 30, 16]);
    }
    refresh();
    if (!wasPaperFull && P[pi].done === P[pi].total) {
      var hr = cards[pi].querySelector('.ch').getBoundingClientRect();
      burst(hr.left + hr.width / 2, hr.top + hr.height / 2, 12, 70);
      burst(hr.left + 40, hr.top + hr.height / 2, 7, 45);
      burst(hr.right - 40, hr.top + hr.height / 2, 7, 45);
      vib([20, 40, 20, 40, 30]);
    }
    dirtyState();
  });

  /* ---------- save ---------- */
  svb.addEventListener('click', function (e) {
    var wasDirty = ser(st) !== savedStr;
    ripple(svb, e);
    commit();
    if (wasDirty) {
      var r = svb.getBoundingClientRect();
      burst(e.clientX || (r.left + r.width / 2), r.top + r.height / 2, 10, 55);
      vib(18);
    }
  });

  // safety net: don't lose ticks if the page is closed without pressing Save
  function backup() { if (ser(st) !== savedStr) commit(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) backup(); });
  window.addEventListener('pagehide', backup);

  var cfg = {}, ed = [], edI = -1;
  function loadCfg() { try { var o = JSON.parse(window.localStorage.getItem(KEY) || 'null'); cfg = (o && o.cols) || {}; } catch (e) { cfg = {}; } }
  function cwOf(n) { return CW[n] || (n > 8 ? 26 : 84); }
  function applyCols(p, i) {
    var c = cfg[i], f = 0, j;
    if (!p.def) p.def = p.cols.slice();
    if (c && c.length !== undefined) { p.cols = c.map(function (x) { return x[1]; }); p.bits = c.map(function (x) { return x[0]; }); }
    else { p.cols = p.def.slice(); p.bits = p.def.map(function (_, k) { return k; }); }
    p.n = p.cols.length;
    for (j = 0; j < p.n; j++) f |= 1 << p.bits[j];
    p.full = f; p.cw = cwOf(p.n); p.total = p.rows.length * p.n;
  }
  function applyAll() { allTotal = 0; P.forEach(function (p, i) { applyCols(p, i); allTotal += p.total; }); }
  function cn(s) { return String(s || '').replace(/[<>&"']/g, '').replace(/^\s+|\s+$/g, '').slice(0, 14); }
  function openEd(i) {
    var p = P[i]; edI = i;
    ed = p.bits.map(function (b, k) { return [b, p.cols[k]]; });
    $('edm').className = 'edm on'; edRender();
  }
  function edRender() {
    var p = P[edI], h = '<div class="edn">▲ = aro bame · ▼ = aro dane (upor theke = bame theke)</div>', k;
    $('edt').textContent = '✏️ ' + p.t;
    for (k = 0; k < ed.length; k++) {
      h += '<div class="edr" data-k="' + k + '"><button type="button" data-e="up"' + (k ? '' : ' disabled') + '>▲</button>' +
           '<button type="button" data-e="dn"' + (k < ed.length - 1 ? '' : ' disabled') + '>▼</button>' +
           '<input class="edi" value="' + ed[k][1] + '" maxlength="14"><button type="button" class="edd" data-e="del">🗑️</button></div>';
    }
    if (!ed.length) h += '<div class="edn">Kono column nai. Niche theke add koro.</div>';
    $('edl').innerHTML = h;
  }
  function edApply() {
    var p = P[edI], i = edI;
    cfg[i] = ed.map(function (x) { return [x[0], x[1]]; });
    applyCols(p, i);
    allTotal = 0; P.forEach(function (q) { allTotal += q.total; });
    $('ht').textContent = allTotal;
    cards[i].querySelector('.bd').style.setProperty('--cw', p.cw + 'px');
    if (openIdx === i) cards[i].querySelector('.bd').innerHTML = bodyHtml(i);
    refresh(); commit(); edRender();
  }
  $('edl').addEventListener('click', function (e) {
    var b = e.target.closest('[data-e]'), r, k, t, x, key, n, bit;
    if (!b || b.disabled) return;
    r = b.closest('.edr'); k = +r.getAttribute('data-k'); t = b.getAttribute('data-e');
    if (t === 'up' && k > 0) { x = ed[k]; ed[k] = ed[k - 1]; ed[k - 1] = x; }
    else if (t === 'dn' && k < ed.length - 1) { x = ed[k]; ed[k] = ed[k + 1]; ed[k + 1] = x; }
    else if (t === 'del') {
      bit = ed[k][0]; n = 0;
      for (key in st) if (key.split('.')[0] == edI && ((st[key] >> bit) & 1)) n++;
      if (!b.getAttribute('data-arm')) {
        b.setAttribute('data-arm', '1'); b.textContent = 'Sure?'; b.style.width = '58px'; b.style.background = '#f43f5e'; b.style.color = '#fff'; b.style.fontSize = '12px';
        setTimeout(function () { if (b.parentNode) { b.removeAttribute('data-arm'); b.textContent = '🗑️'; b.style.cssText = ''; } }, 2500);
        return;
      }
      for (key in st) if (key.split('.')[0] == edI) { st[key] &= ~(1 << bit); if (!st[key]) delete st[key]; }
      ed.splice(k, 1);
    } else return;
    edApply();
  });
  $('edl').addEventListener('change', function (e) {
    var i = e.target.closest ? e.target.closest('.edi') : null, k, v;
    if (!i) return;
    k = +i.parentNode.getAttribute('data-k'); v = cn(i.value);
    if (!v) { edRender(); return; }
    ed[k][1] = v; edApply();
  });
  $('eadd').onclick = function () {
    var v = cn($('edn').value), used = {}, bit = 0, key;
    if (!v) { $('edn').focus(); return; }
    if (ed.length >= 10) { $('edn').value = ''; $('edn').placeholder = 'Max 10 ta column'; return; }
    ed.forEach(function (x) { used[x[0]] = 1; });
    while (used[bit]) bit++;
    for (key in st) if (key.split('.')[0] == edI) { st[key] &= ~(1 << bit); if (!st[key]) delete st[key]; }
    ed.push([bit, v]); $('edn').value = ''; edApply();
  };
  $('edn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('eadd').click(); } });
  $('edr').onclick = function () {
    var key;
    var rb = $('edr');
    if (!rb.getAttribute('data-arm')) {
      rb.setAttribute('data-arm', '1'); rb.textContent = 'Sure? Sob tick muche jabe, abar chap dao';
      setTimeout(function () { rb.removeAttribute('data-arm'); rb.textContent = 'Reset default'; }, 3500);
      return;
    }
    rb.removeAttribute('data-arm'); rb.textContent = 'Reset default';
    for (key in st) if (key.split('.')[0] == edI) delete st[key];
    ed = P[edI].def.map(function (nm, k) { return [k, nm]; });
    edApply();
  };
  $('edx').onclick = function () { $('edm').className = 'edm'; };
  $('edm').addEventListener('click', function (e) { if (e.target === this) this.className = 'edm'; });

  loadCfg(); applyAll();
  build();
  refresh();
  dirtyState();
})();
</script>
</body>
