<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a18"><title>Study App</title>
<style>
:root{--bg:#070a18;--ln:#1b2352;--b:#8576ff;--bl:#b0a6ff;--tx:#eef0ff;--mt:#9aa4d4;--g:#2dd4bf;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#070a18;color:var(--tx);font-family:Roboto,"Noto Sans Bengali",Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
#fr{flex:1;position:relative;min-height:0}
iframe{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;border:0;background:#070a18;display:none}
iframe.on{display:block}
#sv{display:flex;align-items:center;height:44px;padding:0 10px;background:#0b1029;border-top:1px solid #1c1a45}
#sv span{flex:1;font-size:13px;color:var(--mt);padding-left:4px}#sv span.ok{color:var(--g)}
button{font:inherit;color:inherit;border:0;touch-action:manipulation}
.sb{height:32px;padding:0 20px;border-radius:16px;background:var(--b);font-weight:700;font-size:15px}
.sb:active{transform:scale(.96)}.ib{width:36px;height:32px;margin-left:6px;border-radius:16px;background:#151c46;font-size:17px}
#tb{display:flex;height:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#070a18;border-top:1px solid var(--ln)}
#tb button{flex:1;min-width:0;padding:0 2px;text-align:center;line-height:1.1;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--mt)}
#tb button i{font-style:normal;font-size:21.5px;line-height:1.1}#tb button.on{color:var(--bl);font-weight:700}
#hs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:#070a18;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#hs.on{display:flex}#hs .h{display:flex;align-items:center;padding:10px;border-bottom:1px solid var(--ln)}
#hs input{flex:1;height:40px;margin-right:8px;background:#080c1f;color:var(--tx);border:1px solid #232c62;border-radius:10px;padding:0 10px;font-size:17px}
#hb{flex:1;overflow:auto;padding:10px 12px 30px;font-size:15px;line-height:1.5}
#hb h3{margin:14px 0 4px;font-size:13.5px;letter-spacing:.4px;color:var(--bl)}#hb p{margin:2px 0;color:#dde2ff}#hb .m{color:var(--mt)}
#bn{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;padding:12px 14px;border-radius:14px;background:#1f1b50;border:1px solid #403a94;font-size:15.5px;font-weight:600;display:none}

/* THEME: Indigo (main) + Aqua (second) */
html{background:radial-gradient(130% 55% at 0% 0%,rgba(124,108,255,.32),transparent 62%),radial-gradient(120% 50% at 100% 100%,rgba(45,212,191,.22),transparent 62%),radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.3px) 0 0/20px 20px,linear-gradient(180deg,#070a18,#0d1230 55%,#0a0f26)}
body{background:transparent!important}
iframe{background:transparent!important}
#sv{background:#0a0f26;border-top:1px solid #232c62}
.sb{background:linear-gradient(135deg,#8576ff,#4f8bff);color:#fff}
.ib{background:#151c46}
#tb{height:calc(60px + env(safe-area-inset-bottom,0px));background:#0a0f26;border-top:1px solid #232c62}
#tb button{position:relative}
#tb button i{font-size:21px}
#tb button.on{color:#c4baff}
#tb button.on:before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#8576ff,#2dd4bf)}
#hb h3{color:#f0cd75}
#hs .ib{margin:0;width:40px;height:40px;font-size:24px;line-height:1;border-radius:12px}#hs input{margin:0 8px}
/* WELCOME (home) */
#wl{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 0;background:radial-gradient(130% 55% at 0% 0%,rgba(124,108,255,.38),transparent 62%),radial-gradient(120% 50% at 100% 100%,rgba(45,212,191,.26),transparent 62%),#070a18;transition:opacity .2s}
#wl.out{opacity:0}.wc{max-width:460px;margin:0 auto;padding-bottom:14px}
.hk{margin:2px 2px 10px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#f0cd75}
.hc{margin-bottom:10px;padding:14px;border-radius:16px;background:#0e1330;border:1px solid #232c62}
.hl{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--mt)}
.ht{display:flex;margin-top:8px}.ht>div{flex:1;min-width:0}.ht>div+div{padding-left:12px;border-left:1px solid #232c62;margin-left:12px}
.hv{font-size:26px;font-weight:800;line-height:1.15}.hs{font-size:12px;color:var(--mt);margin-top:1px}
.ht .hv{font-size:22px}.ht>div+div{padding-left:8px;margin-left:8px}
.hsum{margin-top:10px;padding-top:9px;border-top:1px solid #161d45;font-size:13.5px;color:#dde2ff}.hsum b{color:#5eead4}
.hr{display:flex;align-items:center;justify-content:space-between}
.hbig{font-size:34px;font-weight:800;line-height:1.1}
.hbar{display:flex;height:9px;margin-top:10px;border-radius:5px;overflow:hidden;background:#131a40}
.hbar i{display:block;height:100%;transition:width .35s ease-out}
.hd2{margin-top:7px;font-size:13px;color:var(--mt)}.hd2 b.a{color:#5eead4}.hd2 b.l{color:#fb7185}
.hg{display:flex;margin:0 -5px}.hg>.hc{flex:1;margin:0 5px 10px}
.hx{display:flex;align-items:center;justify-content:space-between}.hx input{height:38px;max-width:150px;background:#080c1f;color:var(--tx);border:1px solid #232c62;border-radius:10px;padding:0 8px;font-size:14px}
#wgo{display:block;width:100%;height:50px;margin-top:6px;border-radius:16px;background:linear-gradient(135deg,#8576ff,#4f8bff);color:#fff;font-size:17px;font-weight:800;position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#wgo:active{transform:scale(.98)}
#fsc{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px);background:#060913}
#fsc.on{display:flex}#fsc [hidden]{display:none!important}
#fsc .fsx{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:22px;background:#0e1330;font-size:20px}
.fsd{width:100%;max-width:760px;--pc:#2dd4bf}.fsd.ph-b{--pc:#8576ff}.fsd.ph-r{--pc:#f43f5e}
#fsc .fcw{display:flex;align-items:center;justify-content:center}
#fsc .fc{position:relative;flex:1;min-width:0;max-width:300px;height:1.7em;font-size:34vw;perspective:700px}
#fsc .fcw.h3 .fc{font-size:21vw}
@media(orientation:landscape){#fsc .fc{font-size:38vh}#fsc .fcw.h3 .fc{font-size:26vh}}
@media(min-width:700px) and (orientation:portrait){#fsc .fc{font-size:210px}#fsc .fcw.h3 .fc{font-size:130px}}
#fsc .fc .t,#fsc .fc .b{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#10152f}
#fsc .fc .t{top:0;border-radius:.14em .14em 0 0}#fsc .fc .b{bottom:0;border-radius:0 0 .14em .14em}
#fsc .fc span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#eef0ff;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#fsc .fc .t span{top:0}#fsc .fc .b span{bottom:0}
#fsc .fc:after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#060913;z-index:3}
#fsc .fp,#fsc .fq{z-index:2;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#fsc .fp{transform-origin:50% 100%;animation:fpf .3s ease-in forwards}
#fsc .fq{transform-origin:50% 0;transform:rotateX(90deg);animation:fqf .3s ease-out .15s forwards}
@keyframes fpf{to{transform:rotateX(-90deg)}}@keyframes fqf{to{transform:rotateX(0)}}
#fsc .fcd{flex:none;width:6vw;max-width:36px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#fsc .fcd i{width:14px;height:14px;margin:14px 0;border-radius:50%;background:#9aa4d4}
#fsc .pgl{height:5px;margin:22px 2px 0;border-radius:3px;background:#131a40;overflow:hidden}
#fsc .pgl i{display:block;height:100%;background:var(--pc);transform-origin:0 50%;transform:scaleX(0);transition:transform .25s linear,background-color .5s}
#fsc .tl{margin-top:14px;text-align:center;font-size:17px;color:var(--mt)}
.fsd.ph-r.live .fc span{color:#fb7185}.fsd.urgent .fc span{animation:ap 1s ease-in-out infinite}.fsd.over .fc span{animation:bl .9s steps(2,start) infinite;color:#fb7185}.fsd.over .tl{color:#fb7185}
@keyframes ap{0%,100%{opacity:1}50%{opacity:.45}}@keyframes bl{0%{opacity:1}50%{opacity:.2}}
#fsc .fbr{display:flex;margin-top:26px}#fsc .fbn{min-width:130px;height:50px;margin:0 7px;padding:0 24px;border-radius:25px;background:#0f9488;color:#fff;font-size:18px;font-weight:700}#fsc .fbn.out{background:#0e1330;border:1px solid #232c62;color:#b0a6ff}
#hT{display:flex;overflow-x:auto;padding:8px 8px 0;border-bottom:1px solid var(--ln);scrollbar-width:none}#hT::-webkit-scrollbar{display:none}
#hT button{flex:none;height:36px;margin-right:4px;padding:0 13px;border-radius:12px 12px 0 0;background:none;color:var(--mt);font-size:14px;font-weight:600;white-space:nowrap}
#hT button.on{color:#c4baff;background:#151c46;box-shadow:inset 0 -2px #8576ff}
.cc{margin-bottom:10px;padding:12px;border-radius:14px;background:#0e1330;border:1px solid #232c62}
.cc h4{margin:0 0 8px;font-size:12px;letter-spacing:.4px;color:#f0cd75}
.fr{display:flex;align-items:center}.fr.wrap{flex-wrap:wrap}.mu{margin-top:8px;font-size:12.5px;color:var(--mt)}
.in2{flex:1;min-width:0;width:100%;margin-right:8px;background:#080c1f;color:var(--tx);border:1px solid #232c62;border-radius:10px;padding:9px 10px;font:inherit;font-size:15px}
.rc{margin:0 6px 6px 0;padding:6px 11px;border-radius:12px;background:#151c46;border:1px solid #232c62;color:var(--mt);font-size:13px;font-weight:700;line-height:1.25}
.rc small{display:block;font-size:10.5px;font-weight:500}
.rc.on,.rc.du{background:#3a2c0b;border-color:#b45309;color:#f0cd75}.rc.od{background:#3d1426;border-color:#9f1c3f;color:#fb7185}.rc.dn{background:#0b3a3c;border-color:#0f766e;color:#99f6e4}
.xx{padding:2px 8px;font-size:22px;color:#6e79b6}
.hmg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(7,auto);gap:3px}.hmg i{aspect-ratio:1;border-radius:3px;background:#131a40}
.hmg i.h1{background:#0f5d58}.hmg i.h2{background:#0f8a7f}.hmg i.h3{background:#2dd4bf}.hmg i.h4{background:#a7f3d0}
.bgs{display:flex;flex-wrap:wrap}.bgx{margin:0 6px 6px 0;padding:6px 10px;border-radius:12px;background:#131a40;color:#6e79b6;font-size:12.5px;font-weight:700;opacity:.55}.bgx.on{opacity:1;background:#2a2568;color:#f0cd75;border:1px solid #6d5ef5}
.rw{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #161d45;font-size:14px}.up{color:#5eead4}.dw{color:#fb7185}
#hb input[type=file]{margin:6px 0;font-size:13px;color:var(--mt);max-width:100%}
#tp{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,9,19,.78)}#tp.on{display:flex}
.tpc{width:100%;max-width:420px;max-height:80%;overflow:auto;padding:16px;border-radius:18px;background:#0e1330;border:1px solid #403a94;animation:tpp .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tpp{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.tph{font-size:19px;font-weight:800;color:#f0cd75}.tpn{margin:2px 0 10px;font-size:13px;color:var(--mt)}
.tpi{display:flex;align-items:center;padding:9px 0;border-top:1px solid #161d45}.tps{flex:none;margin-right:10px;white-space:nowrap}.tps b{font-size:14px;font-weight:400;color:#2b3570}.tps b.on{color:#f0cd75}.tpt{flex:1;font-size:16px;line-height:1.35;word-break:break-word}
.tpm{padding:8px 0 0;font-size:13px;color:var(--mt)}.tpr{display:flex;margin-top:12px}.tpr .sb{flex:1;margin-right:8px;height:42px;border-radius:12px}.tpr .sb.ok{margin:0;background:#151c46}
.wr{display:flex;align-items:center;padding:7px 0;border-top:1px solid #161d45;font-size:14px}.wr:first-child{border-top:0}.wr span{flex:none;width:20px;color:#5eead4;font-weight:700}.wr b{flex:1;min-width:0;font-weight:600;word-wrap:break-word}.wr i{flex:none;margin-left:8px;font-style:normal;font-size:12.5px;color:var(--mt)}
.wk{display:flex;align-items:flex-end;height:112px;margin-top:10px}.wk .wc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.wk .wc i{display:block;width:60%;max-width:26px;border-radius:5px 5px 2px 2px;background:#5b50c9}.wk .wc em{font-style:normal;font-size:10px;color:var(--mt);margin-bottom:3px}.wk .wc span{margin-top:5px;font-size:11.5px;color:var(--mt)}.wk .wc small{height:12px;font-size:10px;color:#f0cd75}
#bell{display:none}
body.ffs #sv,body.ffs #tb{display:none}
body.ffs #fr iframe.on{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:35}
#alr{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,9,19,.94)}#alr.on{display:flex}
.alb{width:100%;max-width:360px;text-align:center}.alt{margin-top:6px;font-size:46px;font-weight:800;color:#f0cd75;font-variant-numeric:tabular-nums}.all{margin-top:6px;font-size:20px;font-weight:700;word-break:break-word}
.alx{display:flex;margin-top:28px}.alx button{flex:1;height:54px;margin:0 6px;border-radius:27px;background:#151c46;border:1px solid #232c62;color:#b0a6ff;font-size:17px;font-weight:800}.alx .st{background:linear-gradient(135deg,#f43f5e,#fb7185);border:0;color:#fff}
#sv{background:#080c1f!important;border-top:1px solid #161d45!important}
#sv span{font-size:12.5px;letter-spacing:.2px}
#tb{height:calc(62px + env(safe-area-inset-bottom,0px))!important;background:#080c1f!important;border-top:1px solid #161d45!important}
#tb button{font-size:10.5px!important;font-weight:600;color:#7e88b8!important;letter-spacing:.2px}
#tb button i{display:flex!important;align-items:center;justify-content:center;width:46px;height:28px;margin-bottom:3px;border-radius:14px;font-size:0!important}
#tb button i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tb button.on{color:#d9d4ff!important;font-weight:700}
#tb button.on i{background:rgba(133,118,255,.2)}
#tb button.on:before{display:none!important}
#wl{background:linear-gradient(180deg,#0e1440 0,#070a18 340px) #070a18!important}
.hk{font-size:12px!important;letter-spacing:1.6px!important;color:#f0cd75!important;margin:4px 2px 12px!important}
.hc{margin-bottom:12px!important;padding:16px!important}
.hv{font-weight:800}
#wgo{height:54px!important;border-radius:18px!important;font-size:17px!important;letter-spacing:.2px;box-shadow:none!important}
#hs,#fsc,#tp{background-image:none}
.tpc{background:#0e1330!important;border-color:#232c62!important}
</style></head><body>
<div id="app"><div id="fr"></div>
<div id="sv"><span id="st"></span><button class="ib" id="bell" aria-label="Notifications">🔔</button><button class="ib" id="hi" aria-label="History">🗓️</button><button class="sb" id="sbtn">Save</button></div>
<div id="tb"></div></div>
<div id="hs"><div class="h"><button class="ib" id="hpv" aria-label="Previous day">‹</button><input type="date" id="hd"><button class="ib" id="hnx" aria-label="Next day">›</button><button class="sb" id="hx">Close</button></div><div id="hT"></div><div id="hb"></div></div>
<div id="fsc"><button class="fsx" id="fsx" type="button" aria-label="Exit full screen">✕</button><div class="fsd" id="fsd"><div class="fcw" id="sfw"><div class="fc" id="sfH" hidden><div class="t"><span>0</span></div><div class="b"><span>0</span></div></div><div class="fcd" id="sdH" hidden><i></i><i></i></div><div class="fc" id="sfM"><div class="t"><span>0</span></div><div class="b"><span>0</span></div></div><div class="fcd"><i></i><i></i></div><div class="fc" id="sfS"><div class="t"><span>0</span></div><div class="b"><span>0</span></div></div></div><div class="pgl"><i id="sar"></i></div><div class="tl" id="stl"></div></div><div class="fbr"><button class="fbn" id="fmn" type="button">Start</button><button class="fbn out" id="frs" type="button" hidden>Reset</button></div></div>
<div id="bn"></div>
<div id="alr"><div class="alb"><div style="font-size:44px">⏰</div><div class="alt" id="alt"></div><div class="all" id="all"></div><div class="alx"><button id="alsn" type="button">Snooze 5m</button><button id="alst" type="button" class="st">Stop</button></div></div></div>

<div class="hk">TODAY</div>

</div></div>
<script>
(function(){

nt-weight:800;line-height:1;color:#5eead4}\n.smt span{flex:1;margin-left:9px;font-size:14px;line-height:1.35;color:var(--mt)}\n.smt button{height:28px;padding:0 11px;border-radius:14px;background:#221e56;border:1px solid #342f7a;color:var(--bl);font-size:13px;font-weight:600}\n.smt button:active{transform:scale(.96)}\n.pbar{display:flex;height:8px;margin-top:11px;background:#131a40;border-radius:4px;overflow:hidden}\n.pbar i{display:block;height:100%;width:0;transition:width .35s ease-out}#bg{background:var(--g)}#bb{background:var(--r)}\n.smd{margin-top:8px;font-size:13.5px;color:var(--mt)}.smd b.a{color:#5eead4}.smd b.l{color:var(--rl)}.smd .w{color:var(--bl)}\n.sn{min-height:16px;margin-top:4px;font-size:13.5px;color:var(--rl)}\n.pw{flex:none;display:flex;align-items:center;margin-left:6px}\n.pi{width:48px;height:30px;padding:0 4px;background:#080c1f;border:1px solid #232c62;border-radius:8px;text-align:center;font-size:15.5px;font-weight:700;color:var(--bl);-moz-appearance:textfield}\n.pi::-webkit-inner-spin-button,.pi::-webkit-outer-spin-button,#ap::-webkit-inner-spin-button,#ap::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n.pi:focus{outline:none;border-color:#8576ff}.pw em{margin-left:2px;font-style:normal;font-size:13.5px;color:var(--mt)}\n.c1 .pi{margin:0}\n<\/style><style>\n/* THEME: Indigo (main) + Aqua (second) */\n:root{--main:#8576ff;--main2:#2dd4bf;--c1:#bdb4ff;--c2:#5eead4;--c3:#f0cd75;--c4:#f9a8d4;--c5:#7dd3fc}\nhtml,body{background:transparent!important}\niframe{background:transparent!important}\nbody{line-height:1.4;-webkit-text-size-adjust:100%}\n.hd{background:#070a18!important;border-bottom:1px solid #232c62!important}\n/* colourful headlines */\n.hd h1,.hl,.hl2,.card>.h1,.ttl,.hbh>span{background:linear-gradient(90deg,#c4baff,#5eead4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}\n.hl,.hl2,.hbh>span{width:-webkit-fit-content;width:fit-content}\n.hd h1{font-size:21px}\n.gl{color:var(--c3)!important;letter-spacing:.6px}\n.ct .t{color:var(--c3)}.lbl{color:var(--c1)}\n.card,.sc,.cd,.ph,.hero{background:linear-gradient(160deg,#1b2455 0%,#141b3f 100%);border-color:#1f2858}\n/* section / phase / paper titles */\nsection.sc:nth-of-type(1) .tt b,section.ph:nth-of-type(1) .pn b,#list>.cd:nth-child(5n+1) .tt b{color:var(--c1)}\nsection.sc:nth-of-type(2) .tt b,section.ph:nth-of-type(2) .pn b,#list>.cd:nth-child(5n+2) .tt b{color:var(--c2)}\nsection.sc:nth-of-type(3) .tt b,section.ph:nth-of-type(3) .pn b,#list>.cd:nth-child(5n+3) .tt b{color:var(--c3)}\nsection.sc:nth-of-type(4) .tt b,section.ph:nth-of-type(4) .pn b,#list>.cd:nth-child(5n+4) .tt b{color:var(--c4)}\nsection.sc:nth-of-type(5) .tt b,section.ph:nth-of-type(5) .pn b,#list>.cd:nth-child(5n+5) .tt b{color:var(--c5)}\n.ar[data-act=\"study\"] .an b{color:var(--c2)}.ar[data-act=\"cls\"] .an b{color:var(--c1)}\n.ar[data-act=\"pc\"] .an b{color:var(--c4)}.ar[data-act=\"ent\"] .an b{color:var(--c3)}.ar[data-act=\"task\"] .an b{color:var(--c5)}\n/* colourful task names */\n.it:nth-child(5n+1):not(.done):not(.fail) .lb,.tk:nth-child(5n+1):not(.done):not(.fail) .lb,.r:nth-child(5n+1):not(.done) .nm,#rows .r:nth-child(5n+1) .c1>span{color:var(--c1)}\n.it:nth-child(5n+2):not(.done):not(.fail) .lb,.tk:nth-child(5n+2):not(.done):not(.fail) .lb,.r:nth-child(5n+2):not(.done) .nm,#rows .r:nth-child(5n+2) .c1>span{color:var(--c2)}\n.it:nth-child(5n+3):not(.done):not(.fail) .lb,.tk:nth-child(5n+3):not(.done):not(.fail) .lb,.r:nth-child(5n+3):not(.done) .nm,#rows .r:nth-child(5n+3) .c1>span{color:var(--c3)}\n.it:nth-child(5n+4):not(.done):not(.fail) .lb,.tk:nth-child(5n+4):not(.done):not(.fail) .lb,.r:nth-child(5n+4):not(.done) .nm,#rows .r:nth-child(5n+4) .c1>span{color:var(--c4)}\n.it:nth-child(5n+5):not(.done):not(.fail) .lb,.tk:nth-child(5n+5):not(.done):not(.fail) .lb,.r:nth-child(5n+5):not(.done) .nm,#rows .r:nth-child(5n+5) .c1>span{color:var(--c5)}\n/* tick = aqua, cross = rose */\n.xf{flex:none; ,.ph,.hero,.cc,.hc,.hero-card,.phase-group,.analytics-card{background:#0e1330!important;border:1px solid #1b2352!important;border-radius:16px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)!important}\n.cd.open{border-color:#2a6b76!important}\n.ch,.cd.open .ch{border-radius:15px!important}.cd.open .ch{border-radius:15px 15px 0 0!important;background:#0b1029!important}\n.r:last-child{border-radius:0 0 15px 15px!important}\n.r{background:#0a0e24!important}.r.done{background:#08242a!important}\n.hero-card,.header-icon,.btn-main,.bt,.sb{box-shadow:none!important}\n.gl{font-size:11.5px!important;letter-spacing:1.4px!important;text-transform:uppercase;font-weight:800!important}\n.hl,.ct .t,.hk{letter-spacing:.9px!important}\n.it:not(.done):not(.fail) .lb,.tk:not(.done):not(.fail) .lb,.r:not(.done) .nm,#rows .r .c1>span{color:#eceeff!important}\nsection.sc .tt b,section.ph .pn b,#list>.cd .tt b,.ar[data-act] .an b{color:#f0f2ff!important}\n.hv,.hbig,.big,.n,.rv,.hv{font-variant-numeric:tabular-nums}\n.rp{display:none!important}\n.pt:nth-child(n+9){display:none!important}\n.lst,.cd.open .bd{animation:none!important}\nbutton:active,.ch:active,.row:active,.tr:active{opacity:.86}\n.q{background:#0e1330!important;border-radius:16px!important}\n<\/style><\/head><body>\n<div class=\"hd\"><h1>Dream Focus<\/h1><span id=\"dt\"><\/span><\/div>\n<div class=\"card\"><div class=\"h1\">Let's give the best for my dream<\/div><div class=\"h2\">We gave a lot of time in distraction or entertainment, now <b>only focus on study<\/b>.<\/div><\/div>\n<div class=\"card\">\n  <div class=\"nv\"><button id=\"pv\" type=\"button\" aria-label=\"Previous day\">‹<\/button><b id=\"dl\"><\/b><button id=\"nx\" type=\"button\" aria-label=\"Next day\">›<\/button><\/div>\n  <div class=\"smy\"><div class=\"smt\"><b id=\"sp\">0<\/b><span id=\"sl\">points I got<\/span><\/div><div class=\"pbar\"><i id=\"bg\"><\/i><i id=\"bb\"><\/i><\/div><div class=\"smd\" id=\"sd\"><\/div><div class=\"sn\" id=\"sn\"><\/div><\/div>\n  <div class=\"th\"><div class=\"c1\">TASK<button id=\"ad\" type=\"button\" aria-label=\"Add issue\">+<\/button><\/div><div class=\"c2\">DONE<\/div><div class=\"c3\">LOST<\/div><\/div>\n  <div id=\"adr\" hidden><div class=\"ar2\"><input id=\"ai\" placeholder=\"Kaj likho…\" maxlength=\"80\"><input id=\"ap\" type=\"number\" inputmode=\"numeric\" min=\"1\" max=\"999\" placeholder=\"pt\"><button id=\"ab\" type=\"button\">Add<\/button><\/div><div id=\"ah\"><\/div><\/div>\n  <div id=\"rows\"><\/div>\n  <div class=\"tf\"><span>Points I got / lost<\/span><b id=\"tg\">0<\/b><b id=\"tb\">0<\/b><\/div><div class=\"tf t2\"><span>Total points<\/span><b id=\"tt\">0<\/b><\/div>\n<\/div>\n<script>\n(function () {\n  var KEY = 'dream_focus_v1', WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  var DB = { issues: [], days: {} }, $ = function (i) { return document.getElementById(i); };\n  function p2(n) { return n < 10 ? '0' + n : '' + n; }\n  function key(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }\n  function parse(k) { var a = k.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }\n  function add(k, n) { var d = parse(k); d.setDate(d.getDate() + n); return key(d); }\n  function load() { try { var o = JSON.parse(window.localStorage.getItem(KEY) || 'null'); if (o) { DB.issues = o.issues || []; DB.days = o.days || {}; } } catch (e) {} }\n  function pt(v) { v = Math.round(+v || 0); return Math.max(0, Math.min(999, v)); }\n  function norm() { for (var i = 0; i < DB.issues.length; i++) DB.issues[i].p = pt(DB.issues[i].p); }\n  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }\n  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;'); }\n  var today = key(new Date()), sel = today;\n  function label(k) { var d = parse(k); return (k === today ? 'Today \\u00b7 ' : '') + WD[d.getDay()] \n<div class=\"hd\">\n  <h1>Goal Planner<\/h1>\n  <span class=\"ov\" id=\"ov\">0%<\/span>\n<\/div>\n<div id=\"app\"><\/div>\n<div id=\"fx\"><\/div>\n\n<script>\n(function () {\n  var KEY = 'goal_planner_v1';\n  var SECS = [\n    { id: 'wk', t: 'Weekly Goal', ic: '🎯', grp: 'Goals', ph: 'Write a weekly goal…', add: 'New goal', time: false, auto: 'week' },\n    { id: 'mo', t: 'Monthly Goal', ic: '📅', grp: '', ph: 'Write a monthly goal…', add: 'New goal', time: false, auto: 'month' },\n    { id: 'td', t: 'Today List', ic: '☀️', grp: 'Daily', ph: 'What will you do today?', add: 'New task', time: true },\n    { id: 'todo', t: 'To-do List', ic: '✅', grp: '', ph: 'Add a to-do…', add: 'New to-do', time: true },\n    { id: 'th', t: 'Thought to Do', ic: '💡', grp: '', ph: 'Write a thought…', add: 'New thought', time: true }\n  ];\n  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n  var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n  var COL = ['#2dd4bf', '#5eead4', '#2dd4bf', '#8576ff', '#99f6e4', '#f43f5e', '#b0a6ff', '#ffffff'];\n\n  var DB = { items: [], col: {}, nid: 1 };\n  try {\n    var raw = window.localStorage.getItem(KEY);\n    if (raw) {\n      var o = JSON.parse(raw);\n      if (o && o.items) DB = o;\n      if (!DB.col) DB.col = {};\n      if (!DB.nid) DB.nid = DB.items.length + 1;\n    }\n  } catch (e) {}\n  function save() { try { window.localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }\n\n  var app = document.getElementById('app'), fx = document.getElementById('fx');\n  var editing = null; // { sec, id }\n\n  /* ---------- helpers ---------- */\n  function esc(s) {\n    return String(s).replace(/&/g, '&amp;').replace(/<\/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\n  }\n  function p2(n) { return n < 10 ? '0' + n : '' + n; }\n  function secOf(id) { for (var i = 0; i < SECS.length; i++) if (SECS[i].id === id) return SECS[i]; return null; }\n  function item  { g: 'Math', ic: '📐', t: 'Math 1st Paper', pre: 'Ch', un: 'chapters', cols: CM, rows: [\n      'ম্যাট্রিক্স ও নির্ণায়ক', 'ভেক্টর', 'সরলরেখা', 'বৃত্ত', 'বিন্যাস ও সমাবেশ',\n      'ত্রিকোণমিতিক অনুপাত', 'সংযুক্ত কোণের ত্রিকোণমিতিক অনুপাত',\n      'ফাংশন ও ফাংশনের লেখচিত্র', 'অন্তরীকরণ', 'যোগজীকরণ'] },\n    { g: 'Math', ic: '📐', t: 'Math 2nd Paper', pre: 'Ch', un: 'chapters', cols: CM, rows: [\n      'বাস্তব সংখ্যা ও অসমতা', 'যোগাশ্রয়ী প্রোগ্রাম', 'জটিল সংখ্যা', 'বহুপদী ও বহুপদী সমীকরণ',\n      'দ্বিপদী বিস্তৃতি', 'কণিক', 'বিপরীত ত্রিকোণমিতিক ফাংশন ও ত্রিকোণমিতিক সমীকরণ',\n      'স্থিতিবিদ্যা', 'সমতলে বস্তুকণার গতি', 'বিস্তার পরিমাপ ও সম্ভাবনা'] },\n    { g: 'Physics', ic: '🔭', t: 'Physics 1st Paper', pre: 'Ch', un: 'chapters', cols: C6, rows: [\n      'ভৌত জগত ও পরিমাপ', 'ভেক্টর', 'গতিবিদ্যা', 'নিউটনিয়ান বলবিদ্যা', 'কাজ, শক্তি ও ক্ষমতা',\n      'মহাকর্ষ ও অভিকর্ষ', 'পদার্থের গাঠনিক ধর্ম', 'পর্যাবৃত্ত গতি', 'তরঙ্গ',\n      'আদর্শ গ্যাস ও গ্যাসের গতিতত্ত্ব'] },\n    { g: 'Physics', ic: '🔭', t: 'Physics 2nd Paper', pre: 'Ch', un: 'chapters', cols: C6, rows: [\n      'তাপগতিবিদ্যা', 'স্থির তড়িৎ', 'চল তড়িৎ', 'তড়িৎ প্রবাহের চৌম্বক ক্রিয়া ও চুম্বকত্ব',\n      'তাড়িতচৌম্বক আবেশ ও পরিবর্তী প্রবাহ', 'জ্যামিতিক আলোকবিজ্ঞান', 'ভৌত আলোকবিজ্ঞান',\n      'আধুনিক পদার্থবিজ্ঞানের সূচনা', 'পরমাণুর মডেল ও নিউক্লিয়ার পদার্থবিজ্ঞান',\n      'সেমিকন্ডাক্টর ও ইলেকট্রনিক্স',\n      'জ্যোতির্বিজ্ঞান'] },\n    { g: 'Chemistry', ic: '🧪', t: 'Chemistry 1st Paper', pre: 'Ch', un: 'chapters', cols: CH, rows: [\n      'ল্যাবরেটরির নিরাপদ ব্যবহার', 'গুণগত রসায়ন', 'মৌলের পর্যায়বৃত্ত ধর্ম ও রাসায়নিক বন্ধন',\n      'রাসায়নিক পরিবর্তন', 'কর্মমুখী রসায়ন'] },\n    { g: 'Chemistry', ic: '🧪', t: 'Chemistry 2nd Paper', pre: 'Ch', un: 'chapters', cols: CH, rows: [\n      'পরিবেশ রসায়ন', 'জৈব রসায়ন', 'পরিমাণগত রসায়ন', 'তড়িৎ রসায়ন', 'অর্থনৈতিক রসায়ন'] },\n    { g: 'Biology', ic: '🧬', t: 'Biology 1st · Botany', pre: 'Ch', un: 'chapters', cols: CB, rows: [\n      'কোষ ও এর গঠন', 'কোষ বিভাজন', 'কোষ রসায়ন', 'অণুজীব', 'শৈবাল ও ছত্রাক',\n      'ব্রায়োফাইটা ও টেরিডোফাইটা', 'নগ্নবীজী ও আবৃতবীজী উদ্ভিদ', 'টিস্যু ও টিস্যুতন্ত্র',\n      'উদ্ভিদ শারীরতত্ত্ব', 'উদ্ভিদ প্রজনন', 'জীবপ্রযুক্তি', 'জীবের পরিবেশ বিস্তার ও সংরক্ষণ'] },\n    { g: 'Biology', ic: '🧬', t: 'Biology 2nd · Zoology', pre: 'Ch', un: 'chapters', cols: CB, rows: [\n      'প্রাণীর বিভিন্নতা ও শ্রেণিবিন্যাস', 'প্রাণীর পরিচিতি',\n      'মানব শারীরতত্ত্ব (পরিপাক ও শোষণ)', 'মানব শারীরতত্ত্ব (রক্ত ও সঞ্চালন)',\n      'মানব শারীরতত্ত্ব (শ্বাসক্রিয়া ও শ্বসন)', 'মানব শারীরতত্ত্ব (বর্জ্য ও নিষ্কাশন)',\n      'মানব শারীরতত্ত্ব (চলন ও অঙ্গচালনা)', 'মানব শারীরতত্ত্ব (সমন্বয় ও নিয়ন্ত্রণ)',\n      'মানব জীবনের ধারাবাহিকতা', 'মানবদেহের প্রতিরক্ষা', 'জিনতত্ত্ব ও বিবর্তন', 'প্রাণীর আচরণ'] },\n    { g: 'ICT', ic: '💻', t: 'ICT', pre: 'Ch', un: 'chapters', cols: CI, rows: [\n      'তথ্য ও যোগাযোগ প্রযুক্তি: বিশ্ব ও বাংলাদেশ প্রেক্ষিত', 'কমিউনিকেশন সিস্টেম ও নেটওয়ার্কিং',\n      'সংখ্যা পদ্ধতি ও ডিজিটাল ডিভাইস', 'ওয়েব ডিজাইন পরিচিতি এবং HTML', 'প্রোগ্রামিং ভাষা',\n      'ডেটাবেজ ম্যানেজমেন্ট সিস্টেম'] },\n    { g: 'Bangla', ic: '📖', t: 'Bangla 1st Paper', pre: 'T', un: 'topics', cols: B1, rows: [\n      'যৌবনের গান', 'বিদ্রোহী', 'সাহিত্যের খেলা', 'ঋতু বর্ণন', 'অপরিচিতা', 'সোনার তরী', 'অর্ধাঙ্গী',\n      'পদ্মা', 'বিলাসী', 'প্রতিদান', 'জীবন ও বৃক্ষ', 'বিভীষণের প্রতি মেঘনাদ', 'গন্তব্য কাবুল',\n      'আঠারো বছর বয়স', 'রেইনকোট', 'ফেব্রুয়ারি ১৯৬৯', 'কপিলদাস মুর্মুর শেষ কাজ',\n      'প্রত্যাবর্তনের লজ্জা', 'মাসি-পিসি', 'সুচেতনা', 'নেকলেস', 'তাহারই পড়ে মনে',\n      'বাঙলার নব্য লেখকদিগের প্রতি নিবেদন', 'আমি কিংবদন্তির কথা বলছি', 'লালসালু (উপন্যাস)',\n      'সিরাজউদ্দৌলা (নাটক)'] },\n    { g: 'Bangla', ic: '📘', t: 'Bangla 2nd · Grammar', pre: 'T', un: 'topics', cols: BGram, rows: [\n      'উচ্চারণ', 'বানান, ণ-ত্ব/ষ-ত্ব বিধান, শুদ্ধিকরণ, বাক্যের অপপ্রয়োগ', 'ব্যাকরণিক শব্দশ্রেণি ও উপসর্গ',\n      'সমাস', 'প্রকৃতি প্রত্যয় ও শব্দের শ্রেণিবিভাগ', 'বাক্য রূপান্তর'] },\n    { g: 'Bangla', ic: '📝', t: 'Bangla 2nd · Writing', pre: 'T', un: 'topics', cols: BWrite, rows: [\n      'পারিভাষিক শব্দ ও অনুবাদ', 'প্রতিবেদন', 'আবেদন পত্র', 'রচনা', 'সারাংশ ও সারমর্ম'] },\n    { g: 'English', ic: '📚', t: 'English · Text & Grammar', pre: 'T', un: 'topics', cols: E3, rows: [\n      'Unit 1, 2', 'Unit 3, 5', 'Unit 6, 7', 'Unit 8', 'Unit 9, 11', 'Unit 10, 12',\n      'Right Forms of Verb', 'Information Transfer, Flow Chart', 'Narration', 'Modifiers',\n      'Summary Writing, Question & Answering', 'Special Phrase, Articles', 'Completing Sentences',\n      'Connectors, Pronoun Reference', 'Preposition, Punctuation', 'Synonym & Antonym',\n      'Cloze Test with & without clues, Re-arrange', 'Changing Sentences'] },\n    { g: 'English', ic: '✍️', t: 'English · Writing', pre: 'T', un: 'topics', cols: EWrite, rows: [\n      'Paragraph', 'Essay', 'Completing stories', 'Report Writing', 'Formal Letter',\n      'Informal Letter', 'E-mail', 'Graph-Chart', 'Theme/Appreciation'] }\n  ];\n\n  var CW = { 8: 30, 7: 33, 6: 38, 5: 40, 4: 48, 3: 56, 2: 66 };\n  var KEY = 'syllabus_tracker_v1';\n  var OLD = 'hsc_tracker_v1';\n  var COL = ['#2dd4bf', '#5eead4', '#2dd4bf', '#8576ff', '#99f6e4', '#f43f5e', '#b0a6ff', '#ffffff'];\n\n  var st = {}, savedStr = '', openIdx = -1, allTotal = 0, ver = 1;\n\n  P.forEach(function (p) {\n    p.n = p.cols.length;\n    p.full = (1 << p.n) - 1;\n    p.cw = CW[p.n];\n    p.total = p.rows.length * p.n;\n    p.done = 0;\n    allTotal += p.total;\n  });\n\n  function ser(o) {\n    var ks = Object.keys(o).sort(), out = [], i;\n    for (i = 0; i < ks.length; i++) out.push(ks[i] + ':' + o[ks[i]]);\n    return out.join(',');\n  }\n\n  // load saved (and migrate from the first version if present)\n  try {\n    var raw = window.localStorage.getItem(KEY);\n    if (raw) {\n      var ob = JSON.parse(raw);\n      st = ob.st || {};\n      ver = ob.v || 1;\n    } else {\n      var old = window.localStorage.getItem(OLD);\n      if (old) {\n        var os = JSON.parse(old).st || {};\n        Object.k
