ats\" id=\"heroTimerStats\">০ মি অতিবাহিত / ১৫ মি মোট<\/div>\n        <\/div>\n\n        <!-- Fast SVG Dial -->\n        <div class=\"dial-wrap\">\n          <svg class=\"dial-svg\" viewBox=\"0 0 70 70\">\n            <circle class=\"dial-bg\" cx=\"35\" cy=\"35\" r=\"30\" />\n            <circle class=\"dial-bar\" id=\"heroDialBar\" cx=\"35\" cy=\"35\" r=\"30\" />\n          <\/svg>\n          <div class=\"dial-center-text\">\n            <span id=\"heroDialStatus\" class=\"dial-status\">প্রস্তুত<\/span>\n            <span id=\"heroDialPct\">০%<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Quick Duration Buttons -->\n      <div class=\"nudge-row\">\n        <button class=\"nudge-btn\" id=\"nudgeMinus5\" type=\"button\">-৫ মি<\/button>\n        <button class=\"nudge-btn\" id=\"nudgePlus5\" type=\"button\">+৫ মি<\/button>\n        <button class=\"nudge-btn\" id=\"nudgePlus15\" type=\"button\">+১৫ মি<\/button>\n      <\/div>\n\n      <!-- Main Action Controls -->\n      <div class=\"controls-grid\">\n        <button class=\"btn-sec\" id=\"prevTaskBtn\" type=\"button\" title=\"পূর্ববর্তী\">⏮<\/button>\n        <button class=\"btn-main\" id=\"playPauseBtn\" type=\"button\">\n          <span id=\"playIcon\">▶<\/span>\n          <span id=\"playText\">শুরু<\/span>\n        <\/button>\n        <button class=\"btn-sec\" id=\"nextTaskBtn\" type=\"button\" title=\"পরবর্তী\">⏭<\/button>\n        <button class=\"btn-sec\" id=\"resetTaskBtn\" type=\"button\" title=\"রিসেট\">🔄<\/button>\n        <button class=\"btn-sec\" id=\"fsBtn\" type=\"button\" title=\"ফুল স্ক্রিন\" aria-label=\"ফুল স্ক্রিন\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\"/><\/svg><\/button>\n      <\/div>\n\n      <!-- Up Next Preview -->\n      <div class=\"up-next-bar\">\n        <div style=\"display:flex;gap:6px;align-items:center\">\n          <span style=\"font-size:9px;font-weight:700;color:var(--text-muted);background:#101633;padding:1px 4px;border-radius:4px\">পরবর্তী<\/span>\n          <span class=\"up-next-title\" id=\"upNextTitle\">Fozor with jamat<\/span>\n        <\/div>\n        <span style=\"font-family:monospace;font-weight:700;color:var(--teal)\" id=\"upNextDur\">20m<\/span>\n      <\/div>\n    <\/section>\n\n    <!-- Phase Selector Filters -->\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:2px\">\n      <span style=\"font-size:11px;font-weight:700;color:var(--text-muted)\">ফেজ নির্বাচন:<\/span>\n      <button class=\"pill-btn active\" id=\"autoPhaseToggleBtn\" style=\"font-size:10.5px;padding:2px 8px\" type=\"button\">\n        ⏰ অটো ফিল্টার\n      <\/button>\n    <\/div>\n\n    <div style=\"display:flex;align-items:center;gap:4px\">\n      <button class=\"pf-arr\" id=\"phPrev\" type=\"button\" aria-label=\"আগের ফেজ\">‹<\/button>\n      <div class=\"phase-filter-bar\" id=\"phaseFilterTabs\" style=\"flex:1;min-width:0\">\n      <button class=\"phase-chip\" data-phase=\"all\" type=\"button\">সব ফেজ<\/button>\n      <button class=\"phase-chip active\" data-phase=\"1\" type=\"button\">Phase 1 (সকাল)<\/button>\n      <button class=\"phase-chip\" data-phase=\"2\" type=\"button\">Phase 2 (দুপুর)<\/button>\n      <button class=\"phase-chip\" data-phase=\"3\" type=\"button\">Phase 3 (আসর)<\/button>\n      <button class=\"phase-chip\" data-phase=\"4\" type=\"button\">Phase 4 (মাগরিব)<\/button>\n      <button class=\"phase-chip\" data-phase=\"5\" type=\"button\">Phase 5 (ইশা/রাত)<\/button>\n    <\/div>\n      <button class=\"pf-arr\" id=\"phNext\" type=\"button\" aria-label=\"পরের ফেজ\">›<\/button>\n    <\/div>\n\n    <!-- Time Analytics Card (Clean & Unified, No Duplicate Text) -->\n    <div class=\"analytics-card\" id=\"analyticsCard\">\n      <!-- Injected by JS -->\n    <\/div>\n\n    <!-- Grouped Phase Routine List -->\n    <div id=\"routineContainer\" style=\"display:flex;flex-direction:column;gap:10px\">\n      <!-- Injected by JS -->\n    <\/div>\n\n  <\/main>\n\n  <!-- MODALS -->\n\n  <!-- 1. Phase Time Editor Modal (🕒 সময়) -->\n  <div class=\"modal-overlay\" id=\"phaseTimeModal\" style=\"display:none\">\n    <div class=\"modal-card\">\n      <div class=\"modal-head\">\n        <span id=\"ptmTitle\">🕒 ফেজের সময় নির্ধারণ<\/span>\n        <button class=\"modal-close\" id=\"ptmCloseBtn\" type=\"button\">✕<\/button>\n      <\/div>\n      <input type=\"hidden\" id=\"ptmPhaseNum\">\n      <div class=\"form-group\">\n        <label class=\"form-label\">শুরুর সময় (Start Time)<\/label>\n        <input class=\"form-input\" id=\"ptmStartInput\" type=\"time\">\n      <\/div>\n      <div class=\"form-group\">\n        <label class=\"form-label\">শেষের সময় (End Time)<\/label>\n        <input class=\"form-input\" id=\"ptmEndInput\" type=\"time\">\n      <\/div>\n      <div class=\"modal-footer\">\n        <button class=\"modal-cancel-btn\" id=\"ptmCancelBtn\" type=\"button\">বাতিল<\/button>\n        <button class=\"modal-save-btn\" id=\"ptmSaveBtn\" type=\"button\">সময় সংরক্ষণ করুন ✓<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 2. \"কী পড়ব\" Study Topic Modal (Only for Study Tasks) -->\n  <div class=\"modal-overlay\" id=\"topicModal\" style=\"display:none\">\n    <div class=\"modal-card\">\n      <div class=\"modal-head\">\n        <span>📖 কী পড়বেন নির্ধারণ<\/span>\n        <button class=\"modal-close\" id=\"topicCloseBtn\" type=\"button\">✕<\/button>\n      <\/div>\n      <input type=\"hidden\" id=\"topicTaskId\">\n      <div class=\"form-group\">\n        <label class=\"form-label\">বিষয় বা চ্যাপ্টার নোট লিখুন<\/label>\n        <input class=\"form-input\" id=\"topicInput\" placeholder=\"যেমন: ভেক্টর, গুণগত রসায়ন...\">\n        <div class=\"chips-flex\">\n          <button class=\"chip-item\" data-v=\"পদার্থবিজ্ঞান\" type=\"button\">🔭 পদার্থ<\/button>\n          <button class=\"chip-item\" data-v=\"রসায়ন\" type=\"button\">🧪 রসায়ন<\/button>\n          <button class=\"chip-item\" data-v=\"উচ্চতর গণিত\" type=\"button\">📐 গণিত<\/button>\n          <button class=\"chip-item\" data-v=\"জীববিজ্ঞান\" type=\"button\">🧬 জীববিজ্ঞান<\/button>\n          <button class=\"chip-item\" data-v=\"আইসিটি\" type=\"button\">💻 আইসিটি<\/button>\n          <button class=\"chip-item\" data-v=\"রিভিশন\" type=\"button\">⚡ রিভিশন<\/button>\n          <button class=\"chip-item\" data-v=\"MCQ সল্ভ\" type=\"button\">📝 MCQ সল্ভ<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"form-group\" style=\"margin-top:6px\">\n        <label class=\"form-label\">ক্লাসের নাম (Class name)<\/label>\n        <input class=\"form-input\" id=\"topicClassInput\" maxlength=\"60\" placeholder=\"যেমন: Physics Class-12, Math coaching…\">\n      <\/div>\n      <div class=\"form-group\" style=\"margin-top:6px\">\n        <label class=\"form-label\">সময় (মিনিট)<\/label>\n        <input class=\"form-input\" id=\"topicDurationInput\" type=\"number\" min=\"5\" max=\"480\">\n      <\/div>\n      <div class=\"modal-footer\">\n        <button class=\"modal-cancel-btn\" id=\"topicCancelBtn\" type=\"button\">বাতিল<\/button>\n        <button class=\"modal-save-btn\" id=\"topicSaveBtn\" type=\"button\">সেভ করুন ✓<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 3. Add Task to Specific Phase Modal (+ টাস্ক) -->\n  <div class=\"modal-overlay\" id=\"addTaskModal\" style=\"display:none\">\n    <div class=\"modal-card\">\n      <div class=\"modal-head\">\n        <span id=\"atmTitle\">+ নতুন টাস্ক যোগ<\/span>\n        <button class=\"modal-close\" id=\"atmCloseBtn\" type=\"button\">✕<\/button>\n      <\/div>\n      <input type=\"hidden\" id=\"atmPhaseNum\">\n      <div class=\"form-group\">\n        <label class=\"form-label\">টাস্কের নাম *<\/label>\n        <input class=\"form-input\" id=\"atmTitleInput\" placeholder=\"যেমন: গণিত প্র্যাকটিস...\">\n      <\/div>\n      <div class=\"form-group\">\n        <label class=\"form-label\">সময়সীমা (মিনিট)<\/label>\n        <input class=\"form-input\" id=\"atmDurationInput\" type=\"number\" value=\"30\" min=\"1\" max=\"600\">\n      <\/div>\n      <div class=\"form-group\">\n        <label class=\"form-label\">ক্যাটাগরি<\/label>\n        <select class=\"form-input\" id=\"atmCategorySelect\">\n          <option value=\"পড়াশোনা\">পড়াশোনা<\/option>\n          <option value=\"নামাজ\">নামাজ<\/option>\n          <option value=\"খাওয়া\">খাওয়া<\/option>\n          <option value=\"ঘুম\">ঘুম<\/option>\n          <option value=\"স্বাস্থ্য\">স্বাস্থ্য<\/option>\n          <option value=\"কাজ\">কাজ<\/option>\n          <option value=\"অন্যান্য\">অন্যান্য<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"modal-footer\">\n        <button class=\"modal-cancel-btn\" id=\"atmCancelBtn\" type=\"button\">বাতিল<\/button>\n        <button class=\"modal-save-btn\" id=\"atmSaveBtn\" type=\"button\">যোগ করুন +<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 4. Edit Phase Tasks Modal (✏️ এডিট) -->\n  <div class=\"modal-overlay\" id=\"editPhaseModal\" style=\"display:none\">\n    <div class=\"modal-card\" style=\"max-height:90vh\">\n      <div class=\"modal-head\">\n        <span id=\"epmTitle\">✏️ ফেজ এডিটর<\/span>\n        <button class=\"modal-close\" id=\"epmCloseBtn\" type=\"button\">✕<\/button>\n      <\/div>\n      <input type=\"hidden\" id=\"epmPhaseNum\">\n      <div id=\"epmTaskList\" style=\"display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:55vh\">\n        <!-- Injected by JS -->\n      <\/div>\n      <div class=\"modal-footer\">\n        <button class=\"modal-save-btn\" id=\"epmDoneBtn\" type=\"button\">সম্পন্ন ✓<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 5. Batch Routine Editor (⚙️ সব ফেজ) -->\n  <div class=\"modal-overlay\" id=\"batchEditModal\" style=\"display:none\">\n    <div class=\"modal-card\" style=\"max-height:90vh\">\n      <div class=\"modal-head\">\n        <span>⚙️ সম্পূর্ণ রুটিন এডিটর<\/span>\n        <button class=\"modal-close\" id=\"bemCloseBtn\" type=\"button\">✕<\/button>\n      <\/div>\n      <div id=\"bemContent\" style=\"display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:60vh\">\n        <!-- Injected by JS -->\n      <\/div>\n      <div class=\"modal-footer\">\n        <button class=\"modal-cancel-btn\" id=\"bemResetDefaultBtn\" style=\"width:auto;padding:0 10px;color:#fca5a5\" type=\"button\">রিসেট ডিফল্ট<\/button>\n        <button class=\"modal-save-btn\" id=\"bemSaveBtn\" type=\"button\">সব সংরক্ষণ করুন ✓<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Full screen flip clock -->\n  <div id=\"fsOv\">\n    <button class=\"fs-x\" id=\"fsClose\" type=\"button\" aria-label=\"বন্ধ করুন\">✕<\/button>\n    <div class=\"fs-ph\" id=\"fsPh\"><\/div>\n    <div class=\"fs-tt\" id=\"fsTt\"><\/div>\n    <div class=\"clock-display\" id=\"fsClk\" role=\"timer\"><\/div>\n    <div class=\"fs-st\" id=\"fsStat\"><\/div>\n    <div class=\"fs-bar\"><i id=\"fsBar\"><\/i><\/div>\n    <div class=\"fs-bt\"><button id=\"fsPlay\" type=\"button\">▶ শুরু<\/button><button class=\"sec\" id=\"fsNext\" type=\"button\" aria-label=\"পরবর্তী\">⏭<\/button><\/div>\n  <\/div>\n\n  <script>\n    /**\n     * ULTRA-LIGHTWEIGHT ENGINE DESIGNED FOR REDMI 6A (2GB RAM)\n     */\n    const DEFAULT_ROUTINE = [\n      // Phase 1: Fozor\n      { id: 'p1_prep', phase: 1, title: 'দাঁত ব্রাশ, ফেস ওয়াশ ও ওযু', category: 'অন্যান্য', duration: 15, isStudy: false, status: 0 },\n      { id: 'p1_0', phase: 1, title: 'Fozor with jamat', category: 'নামাজ', duration: 20, isStudy: false, status: 0 },\n      { id: 'p1_1', phase: 1, title: 'Golden hour utilize', category: 'পড়াশোনা', duration: 30, isStudy: true, topic: 'রিভিশন ও গোল্ডেন আওয়ার', status: 0 },\n      { id: 'p1_3', phase: 1, title: 'At least 4-5 hour study', category: 'পড়াশোনা', duration: 240, isStudy: true, topic: 'পদার্থবিজ্ঞান / গণিত সমাধান', status: 0 },\n      { id: 'p1_bf', phase: 1, title: 'Breakfast (সকালের নাস্তা)', category: 'খাওয়া', duration: 30, isStudy: false, status: 0 },\n\n      // Phase 2: Juhr (১:০০ টা থেকে)\n      { id: 'p2_bath', phase: 2, title: 'গোসল ও বাথরুম (Fresh & Shower)', category: 'অন্যান্য', duration: 30, isStudy: false, status: 0 },\n      { id: 'p2_0', phase: 2, title: 'Zuhr with jamat', category: 'নামাজ', duration: 25, isStudy: false, status: 0 },\n      { id: 'p2_lunch', phase: 2, title: 'Lunch (দুপুরের খাবার)', category: 'খাওয়া', duration: 15, isStudy: false, status: 0 },\n      { id: 'p2_2', phase: 2, title: 'At least 2-3 hours study', category: 'পড়াশোনা', duration: 150, isStudy: true, topic: 'রসায়ন / জীববিজ্ঞান', status: 0 },\n\n      // Phase 3: Asor\n      { id: 'p3_0', phase: 3, title: 'Asor with jamat', category: 'নামাজ', duration: 15, isStudy: false, status: 0 },\n      { id: 'p3_1', phase: 3, title: 'Room clean / Egg / WhatsApp / Entertainment', category: 'কাজ', duration: 30, isStudy: false, status: 0 },\n      { id: 'p3_2', phase: 3, title: 'Workout', category: 'স্বাস্থ্য', duration: 30, isStudy: false, status: 0 },\n      { id: 'p3_4', phase: 3, title: 'Me time', category: 'অন্যান্য', duration: 20, isStudy: false, status: 0 },\n      { id: 'p3_7', phase: 3, title: 'Guideline', category: 'পড়াশোনা', duration: 15, isStudy: false, status: 0 },\n      { id: 'p3_8', phase: 3, title: 'Next day resource download', category: 'কাজ', duration: 15, isStudy: false, status: 0 },\n      { id: 'p3_9', phase: 3, title: 'Internet off', category: 'অন্যান্য', duration: 5, isStudy: false, status: 0 },\n\n      // Phase 4: Magrib\n      { id: 'p4_0', phase: 4, title: 'Magrib with jamat', category: 'নামাজ', duration: 15, isStudy: false, status: 0 },\n      { id: 'p4_1', phase: 4, title: '1h 15m study', category: 'পড়াশোনা', duration: 75, isStudy: true, topic: 'আইসিটি / ইংলিশ গ্রামার', status: 0 },\n\n      // Phase 5: Isha\n      { id: 'p5_0', phase: 5, title: 'Isha with jamat', category: 'নামাজ', duration: 20, isStudy: false, status: 0 },\n      { id: 'p5_1', phase: 5, title: 'Ensure 20–30 min dinner max', category: 'খাওয়া', duration: 30, isStudy: false, status: 0 },\n      { id: 'p5_2', phase: 5, title: '3h study', category: 'পড়াশোনা', duration: 120, isStudy: true, topic: 'মেইন সাবজেক্ট স্টাডি', status: 0 },\n      { id: 'p5_3', phase: 5, title: 'Previous chap revision + active recall', category: 'পড়াশোনা', duration: 30, isStudy: true, topic: 'অ্যাক্টিভ রিকল ও রিভিশন', status: 0 },\n      { id: 'p5_4', phase: 5, title: 'Exam', category: 'পরীক্ষা', duration: 30, isStudy: true, topic: 'ডেইলি টেস্ট পেপার ও MCQ', status: 0 },\n      { id: 'p5_5', phase: 5, title: 'Full day tracking', category: 'অন্যান্য', duration: 20, isStudy: false, status: 0 },\n      { id: 'p5_6', phase: 5, title: 'Sleep at 12 pm', category: 'ঘুম', duration: 360, isStudy: false, status: 0 }\n    ];\n\n    const DEFAULT_PHASES = {\n      1: { name: 'Phase 1 · Fozor (সকাল)', start: '04:00', end: '13:00' },\n      2: { name: 'Phase 2 · Zuhr (দুপুর)', start: '13:00', end: '16:30' },\n      3: { name: 'Phase 3 · Asor (আসর)', start: '16:30', end: '18:30' },\n      4: { name: 'Phase 4 · Magrib (সন্ধ্যা)', start: '18:30', end: '20:30' },\n      5: { name: 'Phase 5 · Isha (রাত)', start: '20:30', end: '04:00' }\n    };\n\n    const STORAGE_KEY = 'routine_flow_redmi6a_v1';\n    const LOG_KEY = 'routine_flow_log_v1';\n    let LOG = { days: {} };\n    let curDay = '', savedDay = '', lastTickMs = 0, carry = 0, lastLogSave = 0, logDirty = false;\n    const p2 = n => (n < 10 ? '0' + n : '' + n);\n    // routine day rolls over at 4:00 AM (Phase 5 runs until 4 AM)\n    function rDay(d) {\n      const x = new Date((d ? d.getTime() : Date.now()) - 4 * 3600 * 1000);\n      return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate());\n    }\n    function loadLog() {\n      try { const o = JSON.parse(localStorage.getItem(LOG_KEY) || 'null'); if (o && o.days) LOG = o; } catch (e) {}\n    }\n    function saveLog() {\n      try { localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); } catch (e) {}\n      logDirty = false;\n    }\n    function dayLog(k) { k = k || rDay(); return LOG.days[k] || (LOG.days[k] = { tasks: {}, paused: 0, pSince: 0 }); }\n    function taskLog(t) {\n      const d = dayLog();\n      const o = d.tasks[t.id] || (d.tasks[t.id] = { n: t.title, p: t.duration, ph: t.phase, st: t.isStudy ? 1 : 0, s: 0, d: 0 });\n      if (t.cls) o.c = t.cls;\n      return o;\n    }\n    function closePause(k) {\n      const d = dayLog(k);\n      if (d.pSince) {\n        const sec = Math.min(10800, (Date.now() - d.pSince) / 1000);\n        if (sec > 0) d.paused = (d.paused || 0) + sec;\n        d.pSince = 0;\n        saveLog();\n      }\n    }\n    function startNewDay(oldKey) {\n      if (oldKey) closePause(oldKey);\n      routine.forEach(t => { t.status = 0; });\n      currentIndex = 0;\n      timerSecRemaining = ((routine[0] && routine[0].duration) || 15) * 60;\n      isRunning = false;\n      clearInterval(timerInterval);\n      timerInterval = null;\n      setPlayBtn(false);\n    }\n    function checkNewDay() {\n      const k = rDay();\n      if (curDay && curDay !== k) {\n        startNewDay(curDay);\n        curDay = k;\n        saveState();\n        renderAll();\n      }\n    }\n\n    let routine = [];\n    let phaseTimes = JSON.parse(JSON.stringify(DEFAULT_PHASES));\n    let currentIndex = 0;\n    let isRunning = false;\n    let timerSecRemaining = 0;\n    let autoNext = true;\n    let isSoundEnabled = true;\n    let activeFilter = 'auto'; // 'auto', 'all', '1', '2', '3', '4', '5'\n    let timerInterval = null;\n    let audioCtx = null;\n    let fsOn = false;\n    let lastSP = '';\n    const heroFlip = FlipClock($('heroClock'));\n    const fsFlip = FlipClock($('fsClk'));\n\n    function $(id) { return document.getElementById(id); }\n\n    function escH(x) { return String(x).replace(/&/g, '&amp;').replace(/<\/g, '&lt;'); }\n\n    /* Flip clock: only the digits that change get animated (light for low-end phones) */\n    function flipTo(d, nv, anim) {\n      const ov = d._v;\n      if (ov === nv) return;\n      d._v = nv;\n      const c = d.children;\n      if (!anim) { for (let i = 0; i < 4; i++) c[i].firstChild.textContent = nv; return; }\n      c[0].firstChild.textContent = nv;\n      c[2].firstChild.textContent = ov;\n      c[3].firstChild.textContent = nv;\n      d.classList.remove('go');\n      void d.offsetWidth;\n      d.classList.add('go');\n      clearTimeout(d._t);\n      d._t = setTimeout(() => {\n        c[1].firstChild.textContent = nv;\n        c[2].firstChild.textContent = nv;\n        d.classList.remove('go');\n      }, 440);\n    }\n    function FlipClock(el) {\n      let cur = '', ds = [];\n      return {\n        set(str, anim) {\n          if (str.length !== cur.length) {\n            el.innerHTML = '';\n            ds = [];\n            for (let i = 0; i < str.length; i++) {\n              const ch = str[i];\n              if (ch === ':') {\n                const sp = document.createElement('i');\n                sp.className = 'fsp';\n                sp.textContent = ':';\n                el.appendChild(sp);\n                ds.push(null);\n              } else {\n                const d = document.createElement('div');\n                d.className = 'fd';\n                d._v = ch;\n                d.innerHTML = '<div class=\"u\"><span>' + ch + '<\/span><\/div><div class=\"l\"><span>' + ch + '<\/span><\/div><div class=\"ff\"><span>' + ch + '<\/span><\/div><div class=\"fb\"><span>' + ch + '<\/span><\/div>';\n                el.appendChild(d);\n                ds.push(d);\n              }\n            }\n            el.classList.toggle('h3', str.length > 5);\n          } else {\n            for (let i = 0; i < str.length; i++) {\n              if (ds[i] && str[i] !== cur[i]) flipTo(ds[i], str[i], anim);\n            }\n          }\n          cur = str;\n          el.setAttribute('aria-label', str);\n        }\n      };\n    }\n\n    function showToast(msg) {\n      const t = $('toast');\n      t.textContent = msg;\n      t.classList.add('show');\n      clearTimeout(showToast.tm);\n      showToast.tm = setTimeout(() => t.classList.remove('show'), 2000);\n    }\n\n    function timeStringToMinutes(str) {\n      if (!str) return 0;\n      const [h, m] = str.split(':').map(Number);\n      return (h || 0) * 60 + (m || 0);\n    }\n\n    function formatTime12(timeStr) {\n      if (!timeStr) return '';\n      const [h24, m] = timeStr.split(':').map(Number);\n      const ap = h24 >= 12 ? 'PM' : 'AM';\n      const h12 = h24 % 12 || 12;\n      return `${h12}:${m < 10 ? '0' + m : m} ${ap}`;\n    }\n\n    function formatMinsDetailed(m) {\n      const hr = Math.floor(m / 60);\n      const min = m % 60;\n      if (hr > 0 && min > 0) return `${hr} ঘণ্টা ${min} মি`;\n      if (hr > 0) return `${hr} ঘণ্টা`;\n      return `${min} মি`;\n    }\n\n    function getPhaseWindowMins(pNum) {\n      const p = phaseTimes[pNum] || DEFAULT_PHASES[pNum];\n      const s = timeStringToMinutes(p.start);\n      const e = timeStringToMinutes(p.end);\n      return e >= s ? (e - s) : (1440 - s + e);\n    }\n\n    function getAutoPhase() {\n      const now = new Date();\n      const currentMin = now.getHours() * 60 + now.getMinutes();\n      for (let p = 1; p <= 5; p++) {\n        const ph = phaseTimes[p] || DEFAULT_PHASES[p];\n        const s = timeStringToMinutes(ph.start);\n        const e = timeStringToMinutes(ph.end);\n        if (s <= e) {\n          if (currentMin >= s && currentMin < e) return String(p);\n        } else {\n          if (currentMin >= s || currentMin < e) return String(p);\n        }\n      }\n      return '1';\n    }\n\n    function initAudio() {\n      if (!audioCtx) {\n        const AudioContext = window.AudioContext || window.webkitAudioContext;\n        if (AudioContext) audioCtx = new AudioContext();\n      }\n      if (audioCtx && audioCtx.state === 'suspended') {\n        audioCtx.resume();\n      }\n    }\n\n    function playBeep(type = 'finish') {\n      if ('vibrate' in navigator) {\n        try {\n          if (type === 'end') navigator.vibrate([450, 250, 450, 250, 450]);\n          else if (type === 'finish') navigator.vibrate([150, 80, 200]);\n          else if (type === 'cross') navigator.vibrate([80, 50, 80]);\n          else navigator.vibrate(25);\n        } catch (e) {}\n      }\n      if (!isSoundEnabled) return;\n      try {\n        initAudio();\n        if (!audioCtx) return;\n        const now = audioCtx.currentTime;\n        if (type === 'end') {\n          [0, 0.7, 1.4].forEach(off => {\n            const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = now + off;\n            o.type = 'sine';\n            o.frequency.setValueAtTime(880, t0);\n            g.gain.setValueAtTime(0.001, t0);\n            g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03);\n            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);\n            o.connect(g);\n            g.connect(audioCtx.destination);\n            o.start(t0);\n            o.stop(t0 + 0.5);\n          });\n          return;\n        }\n        const freqs = type === 'finish' ? [587.33, 880, 1174.66] : (type === 'cross' ? [300, 200] : [700]);\n        freqs.forEach((freq, i) => {\n          const osc = audioCtx.createOscillator();\n          const gain = audioCtx.createGain();\n          const t0 = now + i * 0.1;\n          osc.type = 'sine';\n          osc.frequency.setValueAtTime(freq, t0);\n          gain.gain.setValueAtTime(0.001, t0);\n          gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);\n          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);\n          osc.connect(gain);\n          gain.connect(audioCtx.destination);\n          osc.start(t0);\n          osc.stop(t0 + 0.32);\n        });\n      } catch (e) {}\n    }\n\n    function saveState() {\n      try {\n        localStorage.setItem(STORAGE_KEY, JSON.stringify({\n          routine,\n          day: curDay,\n          phaseTimes,\n          currentIndex,\n          timerSecRemaining,\n          autoNext,\n          isSoundEnabled,\n          activeFilter\n        }));\n      } catch (e) {}\n    }\n\n    function loadState() {\n      try {\n        const raw = localStorage.getItem(STORAGE_KEY);\n        if (raw) {\n          const data = JSON.parse(raw);\n          if (Array.isArray(data.routine) && data.routine.length) routine = data.routine;\n          if (data.phaseTimes) phaseTimes = data.phaseTimes;\n          if (typeof data.currentIndex === 'number') currentIndex = data.currentIndex;\n          if (typeof data.timerSecRemaining === 'number') timerSecRemaining = data.timerSecRemaining;\n          if (typeof data.autoNext === 'boolean') autoNext = data.autoNext;\n          if (typeof data.isSoundEnabled === 'boolean') isSoundEnabled = data.isSoundEnabled;\n          if (data.activeFilter) activeFilter = data.activeFilter;\n          if (data.day) savedDay = data.day;\n        }\n      } catch (e) {}\n\n      if (!routine || !routine.length) {\n        routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));\n      }\n      if (!routine[currentIndex]) currentIndex = 0;\n      if (!timerSecRemaining || timerSecRemaining <= 0) {\n        timerSecRemaining = (routine[currentIndex]?.duration || 15) * 60;\n      }\n    }\n\n    /* Timer Functions */\n    function fmtClockDigits(sec) {\n      const h = Math.floor(sec / 3600);\n      const m = Math.floor((sec % 3600) / 60);\n      const s = sec % 60;\n      const pad = n => (n < 10 ? '0' + n : String(n));\n      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;\n    }\n\n    function updateTimerUI() {\n      if (!routine[currentIndex]) return;\n      const cur = routine[currentIndex];\n      const totalSec = Math.max(1, cur.duration * 60);\n      const frac = Math.max(0, Math.min(1, timerSecRemaining / totalSec));\n      const elapsedMins = Math.floor((totalSec - timerSecRemaining) / 60);\n      const pct = Math.round((1 - frac) * 100);\n\n      const cs = fmtClockDigits(timerSecRemaining), an = !document.hidden;\n      heroFlip.set(cs, an);\n      if (fsOn) {\n        fsFlip.set(cs, an);\n        $('fsStat').textContent = `${elapsedMins} মি অতিবাহিত / ${cur.duration} মি মোট`;\n        $('fsBar').style.width = pct + '%';\n      }\n      $('heroTimerStats').textContent = `${elapsedMins} মি অতিবাহিত / ${cur.duration} মি মোট`;\n\n      // Circular Ring: Circumference = 2 * PI * 30 ≈ 188.4\n      const circumference = 188.4;\n      $('heroDialBar').style.strokeDashoffset = circumference * (1 - frac);\n      $('heroDialPct').textContent = `${pct}%`;\n      $('heroDialStatus').textContent = isRunning ? 'চলছে' : 'পজ';\n\n      if (frac < 0.15) $('heroDialBar').style.stroke = '#fb7185';\n      else if (frac < 0.35) $('heroDialBar').style.stroke = '#f0cd75';\n      else $('heroDialBar').style.stroke = '#2dd4bf';\n    }\n\n    function timerTick() {\n      if (!isRunning) return;\n      const now = Date.now();\n      let dt = (now - lastTickMs) / 1000;\n      lastTickMs = now;\n      if (!(dt > 0) || dt > 43200) dt = 1;\n      const cur = routine[currentIndex];\n      if (cur) {\n        taskLog(cur).s += dt;\n        logDirty = true;\n        if (now - lastLogSave > 10000) { saveLog(); lastLogSave = now; }\n      }\n      carry += dt;\n      const step = Math.floor(carry);\n      carry -= step;\n      if (step <= 0) return;\n      if (timerSecRemaining > step) {\n        timerSecRemaining -= step;\n        updateTimerUI();\n        if (timerSecRemaining % 10 < step) saveState();\n      } else {\n        timerSecRemaining = 0;\n        updateTimerUI();\n        onTaskComplete();\n      }\n    }\n\n    function onTaskComplete() {\n      playBeep('end');\n\n      // 1. Auto-Tick\n      if (routine[currentIndex]) {\n        routine[currentIndex].status = 1;\n        taskLog(routine[currentIndex]).d = 1;\n        closePause();\n        saveLog();\n      }\n\n      const curTitle = routine[currentIndex]?.title || 'টাস্ক';\n      showToast(`✅ \"${curTitle}\" সম্পন্ন ও অটো টিক হয়েছে!`);\n\n      // 2. Next task\n      if (currentIndex < routine.length - 1) {\n        currentIndex++;\n        const next = routine[currentIndex];\n        timerSecRemaining = next.duration * 60;\n\n        if (autoNext) {\n          isRunning = true;\n          setTimeout(() => showToast(`⚡ পরবর্তী: \"${next.title}\" শুরু`), 600);\n        } else {\n          isRunning = false;\n          clearInterval(timerInterval);\n          timerInterval = null;\n          setPlayBtn(false);\n          setTimeout(() => showToast(`⏸️ \"${next.title}\" প্রস্তুত`), 600);\n        }\n      } else {\n        isRunning = false;\n        clearInterval(timerInterval);\n        timerInterval = null;\n        setPlayBtn(false);\n        showToast('🏆 আলহামদুলিল্লাহ! সব টাস্ক সম্পন্ন হয়েছে!');\n      }\n\n      saveState();\n      renderAll();\n    }\n\n    function syncFsPlay(r) {\n      const b = $('fsPlay');\n      if (!b) return;\n      b.className = r ? 'paused' : '';\n      b.textContent = r ? '⏸ পজ' : '▶ শুরু';\n    }\n\n    function setPlayBtn(running) {\n      syncFsPlay(running);\n      if (running) {\n        $('playPauseBtn').className = 'btn-main paused';\n        $('playIcon').textContent = '⏸';\n        $('playText').textContent = 'পজ';\n      } else {\n        $('playPauseBtn').className = 'btn-main';\n        $('playIcon').textContent = '▶';\n        $('playText').textContent = 'শুরু';\n      }\n    }\n\n    function togglePlayPause() {\n      initAudio();\n      playBeep('tap');\n      if (isRunning) {\n        timerTick();\n        isRunning = false;\n        clearInterval(timerInterval);\n        timerInterval = null;\n        setPlayBtn(false);\n        dayLog().pSince = Date.now();\n        saveLog();\n        updateTimerUI();\n        saveState();\n      } else {\n        closePause();\n        isRunning = true;\n        lastTickMs = Date.now();\n        carry = 0;\n        if (!timerInterval) timerInterval = setInterval(timerTick, 1000);\n        setPlayBtn(true);\n        updateTimerUI();\n        saveLog();\n      }\n    }\n\n    function selectTask(idx) {\n      if (idx < 0 || idx >= routine.length) return;\n      playBeep('tap');\n      closePause();\n      currentIndex = idx;\n      timerSecRemaining = routine[currentIndex].duration * 60;\n      updateTimerUI();\n      renderAll();\n      saveState();\n    }\n\n    function nudgeTime(mins) {\n      playBeep('tap');\n      const addSec = mins * 60;\n      timerSecRemaining = Math.max(10, timerSecRemaining + addSec);\n      if (routine[currentIndex]) {\n        routine[currentIndex].duration = Math.max(1, routine[currentIndex].duration + mins);\n      }\n      updateTimerUI();\n      renderAll();\n      saveState();\n      showToast(`${mins > 0 ? '+' : ''}${mins} মিনিট সমন্বয় হয়েছে`);\n    }\n\n    /* Render UI Components */\n    function renderHero() {\n      if (!routine[currentIndex]) return;\n      const cur = routine[currentIndex];\n\n      $('heroTaskTitle').textContent = cur.title;\n      $('heroTaskCount').textContent = `টাস্ক ${currentIndex + 1} / ${routine.length}`;\n\n      const pInfo = phaseTimes[cur.phase] || DEFAULT_PHASES[cur.phase];\n      $('heroPhaseBadge').textContent = pInfo.name;\n      $('heroCategoryBadge').textContent = cur.category || 'টাস্ক';\n\n      // Study Topic Display\n      if (cur.isStudy) {\n        $('heroStudyTopicBox').style.display = 'flex';\n        $('heroStudyTopicText').textContent = (cur.topic || 'কী পড়বে সেট করুন...') + (cur.cls ? ' · 🏫 ' + cur.cls : '');\n      } else {\n        $('heroStudyTopicBox').style.display = 'none';\n      }\n\n      if (fsOn) syncFsInfo();\n\n      // Next preview\n      const next = routine[currentIndex + 1];\n      if (next) {\n        $('upNextTitle').textContent = next.title;\n        $('upNextDur').textContent = `${next.duration}m`;\n      } else {\n        $('upNextTitle').textContent = '— রুটিনের সমাপ্তি —';\n        $('upNextDur').textContent = '';\n      }\n\n      updateTimerUI();\n    }\n\n    function renderAnalytics(activePh) {\n      const card = $('analyticsCard');\n      if (!card) return;\n\n      if (activePh === 'all') {\n        const totalTaskMin = routine.reduce((acc, it) => acc + (it.duration || 0), 0);\n        const studyMin = routine.filter(it => it.isStudy).reduce((acc, it) => acc + (it.duration || 0), 0);\n        const free24h = Math.max(0, 1440 - totalTaskMin);\n        const pct = Math.min(100, Math.round((totalTaskMin * 100) / 1440));\n\n        card.innerHTML = `\n          <div class=\"analytics-head\">\n            <span>📊 ২৪ ঘণ্টার সম্পূর্ণ বিশ্লেষণ<\/span>\n            <span style=\"color:var(--teal)\">${pct}% শিডিউলড<\/span>\n          <\/div>\n          <div class=\"analytics-grid\">\n            <div class=\"analytics-box\">\n              <div style=\"color:var(--text-muted)\">⏳ মোট টাস্ক:<\/div>\n              <div class=\"analytics-box-val\">${formatMinsDetailed(totalTaskMin)} <small style=\"font-size:10px;color:var(--text-muted)\">/ ২৪h<\/small><\/div>\n            <\/div>\n            <div class=\"analytics-box\">\n              <div style=\"color:var(--text-muted)\">☕ ফাঁকা বাফার সময়:<\/div>\n              <div class=\"analytics-box-val\" style=\"color:${free24h > 0 ? 'var(--amber)' : 'var(--rose)'}\">\n                ${free24h > 0 ? formatMinsDetailed(free24h) : 'ফাঁকা নেই'}\n              <\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:2px\">\n            <span>📚 পড়াশোনা মোট: <b style=\"color:#c4baff\">${formatMinsDetailed(studyMin)}<\/b><\/span>\n            <span>🌙 ঘুম ও অন্যান্য: <b style=\"color:#fff\">${formatMinsDetailed(Math.max(0, totalTaskMin - studyMin))}<\/b><\/span>\n          <\/div>\n          <div class=\"linear-bar-wrap\">\n            <div class=\"linear-bar-fill\" style=\"width:${pct}%\"><\/div>\n          <\/div>\n        `;\n      } else {\n        const pNum = parseInt(activePh, 10);\n        const pInfo = phaseTimes[pNum] || DEFAULT_PHASES[pNum];\n        const windowMin = getPhaseWindowMins(pNum);\n        const phaseTasks = routine.filter(t => t.phase === pNum);\n        const phaseTaskMin = phaseTasks.reduce((acc, it) => acc + (it.duration || 0), 0);\n        const freeMin = windowMin - phaseTaskMin;\n        const capPct = Math.round((phaseTaskMin * 100) / (windowMin || 1));\n        const isOver = freeMin < 0;\n\n        card.innerHTML = `\n          <div class=\"analytics-head\">\n            <span>⏱️ ${pInfo.name.split('·')[0].trim()} সময় বিশ্লেষণ<\/span>\n            <span style=\"color:var(--amber);font-size:11px\">${formatTime12(pInfo.start)} - ${formatTime12(pInfo.end)}<\/span>\n          <\/div>\n          <div class=\"analytics-grid\">\n            <div class=\"analytics-box\">\n              <div style=\"color:var(--text-muted)\">🕒 ফেজ মোট সময়:<\/div>\n              <div class=\"analytics-box-val\" style=\"color:#fff\">${formatMinsDetailed(windowMin)}<\/div>\n            <\/div>\n            <div class=\"analytics-box\">\n              <div style=\"color:var(--text-muted)\">📝 টাস্কের মোট সময়:<\/div>\n              <div class=\"analytics-box-val\">${formatMinsDetailed(phaseTaskMin)}<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"display:flex;justify-content:space-between;font-size:11px;margin-top:2px;font-weight:700\">\n            <span>${isOver ? `<b style=\"color:var(--rose)\">⚠️ ${formatMinsDetailed(-freeMin)} অতিরিক্ত শিডিউলড!<\/b>` : `<b style=\"color:var(--teal)\">🟢 ${formatMinsDetailed(freeMin)} ফাঁকা সময় আছে<\/b>`}<\/span>\n            <span style=\"color:var(--text-muted)\">${capPct}% ব্যবহৃত<\/span>\n          <\/div>\n          <div class=\"linear-bar-wrap\">\n            <div class=\"linear-bar-fill\" style=\"width:${Math.min(100, capPct)}%;background:${isOver ? 'var(--rose)' : (capPct > 80 ? 'var(--teal)' : 'var(--indigo)')}\"><\/div>\n          <\/div>\n        `;\n      }\n    }\n\n    function renderRoutineList() {\n      const container = $('routineContainer');\n      container.innerHTML = '';\n\n      let currentPhase = activeFilter;\n      if (activeFilter === 'auto') {\n        currentPhase = getAutoPhase();\n      }\n\n      renderAnalytics(currentPhase);\n\n      const doneCount = routine.filter(i => i.status === 1).length;\n      $('topProgress').textContent = `✓ ${doneCount} / ${routine.length} সম্পন্ন`;\n\n      // Update Phase Chips UI\n      document.querySelectorAll('.phase-chip').forEach(btn => {\n        const ph = btn.dataset.phase;\n        if ((activeFilter === 'auto' && ph === currentPhase) || (activeFilter === ph)) {\n          btn.className = 'phase-chip active';\n          if (lastSP !== ph) { lastSP = ph; $('phaseFilterTabs').scrollLeft = Math.max(0, btn.offsetLeft - 40); }\n        } else {\n          btn.className = 'phase-chip';\n        }\n      });\n\n      const autoBtn = $('autoPhaseToggleBtn');\n      if (activeFilter === 'auto') {\n        autoBtn.textContent = `⏰ অটো (${(phaseTimes[currentPhase] || DEFAULT_PHASES[currentPhase]).name.split('·')[0].trim()})`;\n        autoBtn.className = 'pill-btn active';\n      } else {\n        autoBtn.textContent = '⏰ অটো মোড অফ';\n        autoBtn.className = 'pill-btn';\n      }\n\n      const phasesToRender = currentPhase === 'all' ? [1, 2, 3, 4, 5] : [parseInt(currentPhase, 10)];\n\n      phasesToRender.forEach(pNum => {\n        const pInfo = phaseTimes[pNum] || DEFAULT_PHASES[pNum];\n        const phaseTasks = routine\n          .map((item, originalIndex) => ({ item, originalIndex }))\n          .filter(x => x.item.phase === pNum);\n\n        const group = document.createElement('div');\n        group.className = 'phase-group';\n\n        // Phase Header (CLEAN: No duplicate times, only dedicated buttons)\n        const header = document.createElement('div');\n        header.className = 'phase-header';\n        header.innerHTML = `\n          <div class=\"phase-title-text\">\n            <span>●<\/span>\n            <span>${pInfo.name}<\/span>\n          <\/div>\n          <div class=\"phase-btn-group\">\n            <button class=\"ph-btn time\" data-action=\"time\" data-p=\"${pNum}\" type=\"button\">🕒 সময়<\/button>\n            <button class=\"ph-btn add\" data-action=\"add\" data-p=\"${pNum}\" type=\"button\">+ টাস্ক<\/button>\n            <button class=\"ph-btn edit\" data-action=\"edit\" data-p=\"${pNum}\" type=\"button\">✏️ এডিট<\/button>\n          <\/div>\n        `;\n        group.appendChild(header);\n\n        if (phaseTasks.length === 0) {\n          const empty = document.createElement('div');\n          empty.style.padding = '12px';\n          empty.style.textAlign = 'center';\n          empty.style.fontSize = '11px';\n          empty.style.color = 'var(--text-muted)';\n          empty.textContent = 'এই ফেজে কোনো টাস্ক নেই। \"+ টাস্ক\" চাপুন।';\n          group.appendChild(empty);\n        } else {\n          phaseTasks.forEach(({ item, originalIndex }) => {\n            const isActive = originalIndex === currentIndex;\n            const isDone = item.status === 1;\n            const isCross = item.status === 2;\n\n            const row = document.createElement('div');\n            row.className = `task-row ${isActive ? 'active' : ''} ${isDone ? 'done' : ''} ${isCross ? 'fail' : ''}`;\n\n            // Top Line\n            const topLine = document.createElement('div');\n            topLine.className = 'task-top-line';\n\n            // Check\n            const checkBtn = document.createElement('button');\n            checkBtn.className = `task-btn-check ${isDone ? 'checked' : ''}`;\n            checkBtn.textContent = '✓';\n            checkBtn.type = 'button';\n            checkBtn.onclick = (e) => {\n              e.stopPropagation();\n              playBeep(item.status === 1 ? 'tap' : 'finish');\n              item.status = item.status === 1 ? 0 : 1;\n              taskLog(item).d = item.status;\n              saveLog();\n              renderAll();\n              saveState();\n            };\n\n            // Cross\n            const crossBtn = document.createElement('button');\n            crossBtn.className = `task-btn-cross ${isCross ? 'crossed' : ''}`;\n            crossBtn.textContent = '✕';\n            crossBtn.type = 'button';\n            crossBtn.onclick = (e) => {\n              e.stopPropagation();\n              playBeep('cross');\n              item.status = item.status === 2 ? 0 : 2;\n              taskLog(item).d = item.status;\n              saveLog();\n              renderAll();\n              saveState();\n            };\n\n            // Info Clickable\n            const info = document.createElement('div');\n            info.className = 'task-info-block';\n            info.onclick = () => selectTask(originalIndex);\n            info.innerHTML = `\n              <div class=\"task-name\">${item.title}<\/div>\n            `;\n\n            topLine.appendChild(checkBtn);\n            topLine.appendChild(crossBtn);\n            topLine.appendChild(info);\n            row.appendChild(topLine);\n\n            // Sub Line\n            const subLine = document.createElement('div');\n            subLine.className = 'task-sub-line';\n\n            let topicHtml = '';\n            if (item.isStudy) {\n              topicHtml = `<button class=\"topic-btn-pill\" data-action=\"topic\" data-id=\"${item.id}\" type=\"button\">📖 ${item.topic || 'কী পড়বে লিখুন...'}${item.cls ? ' · 🏫 ' + escH(item.cls) : ''}<\/button>`;\n            } else {\n              topicHtml = `<span style=\"font-size:10px;color:var(--text-muted)\">${item.category || 'টাস্ক'}<\/span>`;\n            }\n\n            subLine.innerHTML = `\n              <div>${topicHtml}<\/div>\n              <span class=\"dur-badge\">${item.duration}m<\/span>\n            `;\n\n            row.appendChild(subLine);\n            group.appendChild(row);\n          });\n        }\n\n        container.appendChild(group);\n      });\n    }\n\n    function renderAll() {\n      renderHero();\n      renderRoutineList();\n    }\n\n    /* Modal Handlers */\n    function openPhaseTimeModal(pNum) {\n      playBeep('tap');\n      const p = phaseTimes[pNum] || DEFAULT_PHASES[pNum];\n      $('ptmPhaseNum').value = pNum;\n      $('ptmTitle').textContent = `🕒 ${p.name.split('·')[0].trim()} সময়`;\n      $('ptmStartInput').value = p.start;\n      $('ptmEndInput').value = p.end;\n      $('phaseTimeModal').style.display = 'flex';\n    }\n\n    function openTopicModal(taskId) {\n      playBeep('tap');\n      const item = routine.find(x => x.id === taskId);\n      if (!item) return;\n      $('topicTaskId').value = item.id;\n      $('topicInput').value = item.topic || '';\n      $('topicClassInput').value = item.cls || '';\n      $('topicDurationInput').value = item.duration;\n      $('topicModal').style.display = 'flex';\n      $('topicInput').focus();\n    }\n\n    function openAddTaskModal(pNum) {\n      playBeep('tap');\n      $('atmPhaseNum').value = pNum;\n      $('atmTitleInput').value = '';\n      $('atmDurationInput').value = '30';\n      $('atmTitle').textContent = `+ Phase ${pNum}-এ টাস্ক যোগ`;\n      $('addTaskModal').style.display = 'flex';\n      $('atmTitleInput').focus();\n    }\n\n    function openEditPhaseModal(pNum) {\n      playBeep('tap');\n      $('epmPhaseNum').value = pNum;\n      const p = phaseTimes[pNum] || DEFAULT_PHASES[pNum];\n      $('epmTitle').textContent = `✏️ ${p.name.split('·')[0].trim()} এডিটর`;\n      renderEditPhaseTasks(pNum);\n      $('editPhaseModal').style.display = 'flex';\n    }\n\n    function renderEditPhaseTasks(pNum) {\n      const container = $('epmTaskList');\n      container.innerHTML = '';\n      const pTasks = routine.filter(t => t.phase === pNum);\n\n      if (!pTasks.length) {\n        container.innerHTML = '<div style=\"text-align:center;font-size:11px;color:var(--text-muted);padding:10px\">কোনো টাস্ক নেই<\/div>';\n        return;\n      }\n\n      pTasks.forEach(item => {\n        const row = document.createElement('div');\n        row.style.display = 'flex';\n        row.style.alignItems = 'center';\n        row.style.gap = '6px';\n        row.style.padding = '6px 8px';\n        row.style.background = 'var(--card-inner)';\n        row.style.borderRadius = '8px';\n        row.style.border = '1px solid var(--border-light)';\n\n        row.innerHTML = `\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <button class=\"up-btn\" style=\"font-size:9px;color:var(--text-muted);background:#151c46;padding:2px 4px;border-radius:3px\">▲<\/button>\n            <button class=\"dn-btn\" style=\"font-size:9px;color:var(--text-muted);background:#151c46;padding:2px 4px;border-radius:3px\">▼<\/button>\n          <\/div>\n          <input type=\"text\" class=\"form-input title-inp\" value=\"${item.title}\" style=\"flex:1;padding:4px 6px;font-size:12px\">\n          <input type=\"number\" class=\"form-input dur-inp\" value=\"${item.duration}\" style=\"width:48px;padding:4px;text-align:center;font-size:12px\">\n          <button class=\"del-btn\" style=\"width:26px;height:26px;border-radius:6px;background:#451a24;color:#fca5a5;font-size:11px\">🗑️<\/button>\n        `;\n\n        row.querySelector('.up-btn').onclick = () => moveTask(item.id, -1, pNum);\n        row.querySelector('.dn-btn').onclick = () => moveTask(item.id, 1, pNum);\n        row.querySelector('.title-inp').onchange = (e) => { item.title = e.target.value.trim(); saveState(); };\n        row.querySelector('.dur-inp').onchange = (e) => { item.duration = Math.max(1, parseInt(e.target.value, 10) || 15); saveState(); };\n        row.querySelector('.del-btn').onclick = () => {\n          const idx = routine.findIndex(x => x.id === item.id);\n          if (idx !== -1) {\n            routine.splice(idx, 1);\n            if (currentIndex >= routine.length) currentIndex = Math.max(0, routine.length - 1);\n            saveState();\n            renderEditPhaseTasks(pNum);\n            renderAll();\n          }\n        };\n\n        container.appendChild(row);\n      });\n    }\n\n    function moveTask(taskId, dir, pNum) {\n      const pIndices = [];\n      routine.forEach((it, idx) => { if (it.phase === pNum) pIndices.push(idx); });\n      const curPos = pIndices.findIndex(idx => routine[idx].id === taskId);\n      if (curPos === -1) return;\n      const targetPos = curPos + dir;\n      if (targetPos < 0 || targetPos >= pIndices.length) return;\n\n      const idxA = pIndices[curPos];\n      const idxB = pIndices[targetPos];\n      const temp = routine[idxA];\n      routine[idxA] = routine[idxB];\n      routine[idxB] = temp;\n\n      saveState();\n      renderEditPhaseTasks(pNum);\n      renderAll();\n    }\n\n    /* Batch Editor */\n    function renderBatchEditor() {\n      const container = $('bemContent');\n      container.innerHTML = '';\n\n      for (let p = 1; p <= 5; p++) {\n        const pTasks = routine.filter(t => t.phase === p);\n        const sec = document.createElement('div');\n        sec.style.background = 'var(--card-inner)';\n        sec.style.border = '1px solid var(--border-light)';\n        sec.style.borderRadius = '10px';\n        sec.style.padding = '8px';\n        sec.style.display = 'flex';\n        sec.style.flexDirection = 'column';\n        sec.style.gap = '6px';\n\n        sec.innerHTML = `<div style=\"font-size:12px;font-weight:800;color:var(--amber)\">${(phaseTimes[p] || DEFAULT_PHASES[p]).name}<\/div>`;\n\n        pTasks.forEach(item => {\n          const r = document.createElement('div');\n          r.style.display = 'flex';\n          r.style.alignItems = 'center';\n          r.style.gap = '4px';\n\n          r.innerHTML = `\n            <input type=\"text\" class=\"form-input\" value=\"${item.title}\" style=\"flex:1;padding:4px 6px;font-size:11.5px\">\n            <input type=\"number\" class=\"form-input\" value=\"${item.duration}\" style=\"width:45px;padding:4px;text-align:center;font-size:11.5px\">\n            <button class=\"bdel\" style=\"width:24px;height:24px;background:#451a24;color:#fca5a5;border-radius:4px;font-size:10px\">✕<\/button>\n          `;\n\n          r.querySelector('input[type=\"text\"]').onchange = (e) => { item.title = e.target.value.trim(); };\n          r.querySelector('input[type=\"number\"]').onchange = (e) => { item.duration = Math.max(1, parseInt(e.target.value, 10) || 15); };\n          r.querySelector('.bdel').onclick = () => {\n            const idx = routine.findIndex(x => x.id === item.id);\n            if (idx !== -1) {\n              routine.splice(idx, 1);\n              renderBatchEditor();\n            }\n          };\n\n          sec.appendChild(r);\n        });\n\n        container.appendChild(sec);\n      }\n    }\n\n    /* Event Delegation for Dynamic Elements */\n    document.addEventListener('click', (e) => {\n      initAudio();\n\n      const actEl = e.target.closest('[data-action]');\n      if (!actEl) return;\n      const act = actEl.dataset.action;\n\n      if (act === 'time') {\n        openPhaseTimeModal(parseInt(actEl.dataset.p, 10));\n      } else if (act === 'add') {\n        openAddTaskModal(parseInt(actEl.dataset.p, 10));\n      } else if (act === 'edit') {\n        openEditPhaseModal(parseInt(actEl.dataset.p, 10));\n      } else if (act === 'topic') {\n        openTopicModal(actEl.dataset.id);\n      }\n    });\n\n    // Modal Close and Save listeners\n    $('ptmCloseBtn').onclick = $('ptmCancelBtn').onclick = () => { $('phaseTimeModal').style.display = 'none'; };\n    $('ptmSaveBtn').onclick = () => {\n      const pNum = parseInt($('ptmPhaseNum').value, 10);\n      const s = $('ptmStartInput').value;\n      const en = $('ptmEndInput').value;\n      if (!s || !en) return;\n      if (!phaseTimes[pNum]) phaseTimes[pNum] = Object.assign({}, DEFAULT_PHASES[pNum]);\n      phaseTimes[pNum].start = s;\n      phaseTimes[pNum].end = en;\n      saveState();\n      $('phaseTimeModal').style.display = 'none';\n      renderAll();\n      showToast('ফেজের সময় সেভ হয়েছে ✓');\n    };\n\n    $('topicCloseBtn').onclick = $('topicCancelBtn').onclick = () => { $('topicModal').style.display = 'none'; };\n    document.querySelectorAll('.chip-item').forEach(b => {\n      b.onclick = () => { $('topicInput').value = b.dataset.v; };\n    });\n    $('topicSaveBtn').onclick = () => {\n      const id = $('topicTaskId').value;\n      const item = routine.find(x => x.id === id);\n      if (item) {\n        item.topic = $('topicInput').value.trim();\n        item.cls = $('topicClassInput').value.trim();\n        const d = Math.max(1, parseInt($('topicDurationInput').value, 10) || 30);\n        if (item.id === routine[currentIndex]?.id) {\n          const elapsed = (item.duration * 60) - timerSecRemaining;\n          item.duration = d;\n          timerSecRemaining = Math.max(1, (d * 60) - elapsed);\n        } else {\n          item.duration = d;\n        }\n        saveState();\n        renderAll();\n        showToast('স্টাডি টপিক সেভ হয়েছে ✓');\n      }\n      $('topicModal').style.display = 'none';\n    };\n    $('heroTopicChangeBtn').onclick = () => {\n      if (routine[currentIndex]?.isStudy) openTopicModal(routine[currentIndex].id);\n    };\n\n    $('atmCloseBtn').onclick = $('atmCancelBtn').onclick = () => { $('addTaskModal').style.display = 'none'; };\n    $('atmSaveBtn').onclick = () => {\n      const pNum = parseInt($('atmPhaseNum').value, 10);\n      const title = $('atmTitleInput').value.trim();\n      const dur = Math.max(1, parseInt($('atmDurationInput').value, 10) || 30);\n      const cat = $('atmCategorySelect').value;\n\n      if (!title) { showToast('টাস্কের নাম লিখুন'); return; }\n\n      const isStudy = (cat === 'পড়াশোনা' || cat === 'পরীক্ষা');\n      const newTask = {\n        id: 't_' + Date.now().toString(36),\n        phase: pNum,\n        title,\n        category: cat,\n        duration: dur,\n        isStudy,\n        topic: isStudy ? 'সাধারণ রিভিশন' : '',\n        status: 0\n      };\n\n      let lastIdx = -1;\n      for (let i = 0; i < routine.length; i++) {\n        if (routine[i].phase === pNum) lastIdx = i;\n      }\n      if (lastIdx !== -1) routine.splice(lastIdx + 1, 0, newTask);\n      else routine.push(newTask);\n\n      saveState();\n      $('addTaskModal').style.display = 'none';\n      renderAll();\n      showToast('টাস্ক যোগ হয়েছে ✓');\n    };\n\n    $('epmCloseBtn').onclick = $('epmDoneBtn').onclick = () => {\n      $('editPhaseModal').style.display = 'none';\n      renderAll();\n    };\n\n    $('openBatchEditBtn').onclick = () => {\n      playBeep('tap');\n      renderBatchEditor();\n      $('batchEditModal').style.display = 'flex';\n    };\n    $('bemCloseBtn').onclick = () => { $('batchEditModal').style.display = 'none'; renderAll(); };\n    $('bemSaveBtn').onclick = () => {\n      saveState();\n      $('batchEditModal').style.display = 'none';\n      renderAll();\n      showToast('রুটিন সংরক্ষিত হয়েছে ✓');\n    };\n    $('bemResetDefaultBtn').onclick = () => {\n      if (confirm('রুটিন কি মূল ডিফল্ট HSC রুটিনে ফিরিয়ে নিতে চান?')) {\n        routine = JSON.parse(JSON.stringify(DEFAULT_ROUTINE));\n        phaseTimes = JSON.parse(JSON.stringify(DEFAULT_PHASES));\n        currentIndex = 0;\n        timerSecRemaining = routine[0].duration * 60;\n        saveState();\n        renderBatchEditor();\n        renderAll();\n        showToast('ডিফল্ট রুটিন লোড করা হয়েছে');\n      }\n    };\n\n    // Controller Buttons\n    $('playPauseBtn').onclick = togglePlayPause;\n    $('nextTaskBtn').onclick = () => {\n      if (currentIndex < routine.length - 1) {\n        selectTask(currentIndex + 1);\n        showToast('পরবর্তী টাস্কে স্কিপ করা হলো');\n      } else {\n        showToast('এটিই শেষ টাস্ক');\n      }\n    };\n    $('prevTaskBtn').on
