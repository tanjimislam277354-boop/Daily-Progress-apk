name: Build Syllabus Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Apply Syllabus Tracker launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable-nodpi
          rsvg-convert -w 512 -h 512 assets/syllabus-tracker-icon.svg -o /tmp/syllabus-tracker-icon.png
          cp /tmp/syllabus-tracker-icon.png android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          find android/app/src/main/res -type d -name 'mipmap-*' ! -name 'mipmap-anydpi*' -print0 | while IFS= read -r -d '' dir; do
            cp /tmp/syllabus-tracker-icon.png "$dir/ic_launcher.png"
            cp /tmp/syllabus-tracker-icon.png "$dir/ic_launcher_round.png"
          done
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Syllabus-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
